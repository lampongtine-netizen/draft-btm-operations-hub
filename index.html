function relTime(iso){if(!iso)return'—';const d=new Date(iso);const diffMs=Date.now()-d.getTime();const mins=Math.round(diffMs/60000);if(mins<1)return'Just now';if(mins<60)return `${mins}m ago`;const hrs=Math.round(mins/60);if(hrs<24)return hrs===1?'1 hour ago':`${hrs} hours ago`;const days=Math.round(hrs/24);if(days===1)return'Yesterday';if(days<7)return `${days} days ago`;return d.toLocaleDateString();}
function daysAgo(iso){if(!iso)return 0;return Math.floor((Date.now()-new Date(iso).getTime())/86400000);}
function daysUntil(dateStr){if(!dateStr)return null;return Math.ceil((new Date(dateStr).getTime()-Date.now())/86400000);}
function hoursUntil(iso){if(!iso)return null;return Math.max(0,Math.round((new Date(iso).getTime()-Date.now())/3600000));}
async function loadAll(){
  state.loading=true; state.loadError=null; render();
  try{
    const [adminsRes,studentsRes,tasksRes,activityRes,convosRes,paymentsRes]=await Promise.all([
      sb.from('admins').select('*').order('created_at'),
      sb.from('students').select('*, notes(*), support_plan_goals(*)').order('created_at'),
      sb.from('tasks').select('*').order('created_at'),
      sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(50),
      sb.from('conversations').select('*, messages(*)').order('updated_at',{ascending:false}),
      sb.from('payment_events').select('*').order('created_at',{ascending:false}).limit(250),
    ]);
    if(adminsRes.error)throw adminsRes.error; if(studentsRes.error)throw studentsRes.error; if(tasksRes.error)throw tasksRes.error; if(activityRes.error)throw activityRes.error; if(convosRes.error)throw convosRes.error; if(paymentsRes.error)throw paymentsRes.error;
    team=adminsRes.data.map(a=>({id:a.id,name:a.name,role:a.role}));
    customers=studentsRes.data.map(s=>{
      const goals=(s.support_plan_goals||[]).map(g=>({goal:g.goal,priority:g.priority,target:g.target,status:g.status}));
      const notesArr=(s.notes||[]).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(n=>({id:n.id,text:n.body,author:n.author_name,when:relTime(n.created_at)}));
      return {id:s.id,name:s.name,business:s.business||'—',email:s.email||'—',phone:s.phone||'—',program:s.program,level:s.level,educatorPathway:s.educator_pathway,assigned:s.assigned_to,status:s.status,board:s.board,lastActivity:relTime(s.last_activity_at),enrolledDaysAgo:daysAgo(s.enrolled_at),renewalDaysLeft:daysUntil(s.renewal_date),onboarding:{purchase:true,access:true,onboarding:true,audit:s.audit_status==='Reviewed'?'ok':(s.audit_status==='Submitted'?'pending':'fail')},audit:{status:s.audit_status,submittedAt:s.audit_submitted_at?relTime(s.audit_submitted_at):null,deadlineHoursLeft:s.audit_deadline_at?hoursUntil(s.audit_deadline_at):null},supportPlan:{status:s.support_plan_status,goals},checkIn:{status:s.checkin_status},powerSession:{status:s.power_session_status},payment:s.payment_status,notes:notesArr};
    });
    tasks=tasksRes.data.map(t=>({id:t.id,title:t.title,client:t.student_id,assigned:t.assigned_to,priority:t.priority,due:t.due_date?new Date(t.due_date).toLocaleDateString():'—',done:t.done}));
    activityLog=activityRes.data.map(a=>({time:relTime(a.created_at),text:a.text,user:a.actor_name||'Christine'}));
    conversations=convosRes.data.map(c=>({id:c.id,studentId:c.student_id,name:c.customer_name,status:c.status,unreadForAdmin:c.unread_for_admin,assigned:c.assigned_to,thread:(c.messages||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(m=>({from:m.sender_type==='admin'?'team':'student',text:m.body,time:relTime(m.created_at)}))}));
    paymentEvents=paymentsRes.data||[];
    state.loading=false;
  }catch(err){state.loading=false;state.loadError=err.message||String(err);}
  render();
}

function getActionItems(){const items=[];customers.forEach(c=>{if(c.audit.status==='Submitted'&&c.audit.deadlineHoursLeft!=null){const urgent=c.audit.deadlineHoursLeft<=24;items.push({severity:urgent?'red':'amber',title:`${c.name.split(' (')[0]}'s Business Audit was submitted ${c.audit.submittedAt}`,sub:`Personalised Support Plan due — ${c.audit.deadlineHoursLeft}h left on the 72-hour window`,action:'OPEN AUDIT',target:c.id});}if(c.audit.status==='Not Sent'){items.push({severity:'amber',title:`${c.name.split(' (')[0]} has no Business Audit sent`,sub:'Enrolled but onboarding is stalled',action:'SEND AUDIT',target:c.id});}if(c.powerSession.status==='Needs Booking'){items.push({severity:'amber',title:`${c.name.split(' (')[0]} has not booked their Power Session`,sub:c.business,action:'BOOK SESSION',target:c.id});}if(c.payment==='Failed'){items.push({severity:'red',title:`${c.name.split(' (')[0]}'s payment failed`,sub:'Access/payment status needs review',action:'OPEN CUSTOMER',target:c.id});}if(c.checkIn.status==='Overdue'){items.push({severity:'red',title:`${c.name.split(' (')[0]}'s monthly check-in is overdue`,sub:c.business,action:'OPEN CHECK-IN',target:c.id});}});return items;}

ar(--text-faint);font-weight:400">— ${t.role}</span></div><div style="font-size:12px;color:var(--text-dim)">${customers.filter(c=>c.assigned===t.id).length} clients</div><div class="board-last">${tasks.filter(k=>k.assigned===t.id&&!k.done).length} open</div></div>`).join('')}</div>`:''}</div>`;}
function renderStudents(){let list=customers.slice();const f=state.studentFilter;if(f==='needs-attention')list=list.filter(c=>c.board==='needs'||c.board==='risk');if(f==='new')list=list.filter(c=>c.enrolledDaysAgo<=7);if(f==='payment-issue')list=list.filter(c=>c.payment==='Failed');if(f==='audit-pending')list=list.filter(c=>c.audit.status==='Submitted'||c.audit.status==='Not Sent');if(f==='checkin-due')list=list.filter(c=>c.checkIn.status==='Overdue'||c.checkIn.status==='Submitted');if(f==='session-pending')list=list.filter(c=>c.powerSession.status==='Needs Booking');if(f==='level1')list=list.filter(c=>c.level==='Level 1');if(f==='level2')list=list.filter(c=>c.level==='Level 2');if(f==='educator-pathway')list=list.filter(c=>c.educatorPathway);if(state.studentSearch){const q=state.studentSearch.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(q)||c.business.toLowerCase().includes(q));}const chips=[{k:'all',l:'All'},{k:'needs-attention',l:'Needs Attention'},{k:'new',l:'New This Week'},{k:'level1',l:'Level 1'},{k:'level2',l:'Level 2'},{k:'educator-pathway',l:"Educator's Pathway"},{k:'payment-issue',l:'Payment Issue'},{k:'audit-pending',l:'Audit Pending'},{k:'checkin-due',l:'Check-in Due'},{k:'session-pending',l:'Power Session Pending'}];return `<div class="topline"><div><h1>Students</h1><div class="meta">${list.length} shown · ${customers.length} total</div></div></div><div class="filter-row">${chips.map(c=>`<div class="chip ${state.studentFilter===c.k?'active':''}" data-studentfilter="${c.k}">${c.l}</div>`).join('')}<input class="search-box" placeholder="Search name or business…" id="student-search" value="${state.studentSearch}"/></div><table><thead><tr><th>Student</th><th>Business</th><th>Program</th><th>Level</th><th>Payment</th><th>Audit</th><th>Check-in</th><th>Power Session</th><th>Last activity</th><th>Status</th></tr></thead><tbody>${list.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${c.name.split(' (')[0]}${c.educatorPathway?` <span class="badge neutral" style="font-size:10px;">Educator's Pathway</span>`:''}</td><td>${c.business}</td><td>${c.program}</td><td><span class="badge ${c.level==='Level 2'?'amber':'neutral'}">${c.level}</span></td><td><span class="badge ${statusBadgeClass(c.payment)}">${c.payment}</span></td><td><span class="badge ${statusBadgeClass(c.audit.status)}">${c.audit.status}</span></td><td><span class="badge ${statusBadgeClass(c.checkIn.status)}">${c.checkIn.status}</span></td><td><span class="badge ${statusBadgeClass(c.powerSession.status)}">${c.powerSession.status}</span></td><td>${c.lastActivity}</td><td><span class="badge ${statusBadgeClass(c.status)}">${c.status}</span></td></tr>`).join('')||`<tr><td colspan="10"><div class="empty-state">No records match this filter.</div></td></tr>`}</tbody></table>`;}
function renderProfile(id){const c=findCustomer(id);if(!c)return `<div class="empty-state">Record not found.</div>`;const nextAction=getNextAction(c);const tabs=['overview','audit','support-plan','check-ins','power-sessions','notes'];const tabLabels={overview:'Overview',audit:'Business Audit','support-plan':'Support Plan','check-ins':'Check-Ins','power-sessions':'Power Sessions',notes:'Notes'};return `<div class="breadcrumb"><span data-nav="students">Students</span> / ${c.name.split(' (')[0]}</div><div class="profile-head"><div><h2 class="p-name">${c.name.split(' (')[0]} <span style="font-size:12px;color:var(--text-faint);font-family:'Inter'">(demo record)</span></h2><div class="p-biz">${c.business}</div><div class="p-contact">${c.email} · ${c.phone}</div><div class="profile-meta"><div class="m"><span class="k">Program</span>${c.program}</div><div class="m"><span class="k">Level</span>${c.level}${c.level==='Level 1'?' ($199/wk)':' ($199/wk + $99/wk add-on)'}</div><div class="m"><span class="k">Assigned to</span>${findTeam(c.assigned).name}</div><div class="m"><span class="k">Last active</span>${c.lastActivity}</div><div class="m"><span class="k">Status</span><span class="badge ${statusBadgeClass(c.status)}">${c.status}</span></div></div></div><div class="profile-actions"><button class="btn" data-note-focus="1">Add Note</button><button class="btn" data-toast="Goal-setting UI is Phase 2.">Set Goal</button><button class="btn" data-toast="Needs Google Calendar credentials — not connected yet.">Book Power Session</button><button class="btn" data-nav="communications" data-commsjump="${c.id}">Send Message</button><button class="btn ghost" data-toast="Student platform URL/API not yet provided by BTM.">View Student Experience</button></div></div>${nextAction.text?`<div class="next-action ${nextAction.severity}"><div><div class="na-label">Your next action</div><div class="na-text">${nextAction.text}</div></div><button class="btn primary small" data-tabjump="${nextAction.tab}" function getNextAction(c){if(c.payment==='Failed')return{severity:'',text:`Payment failed — access/payment status needs review before continuing advisory work.`,cta:'REVIEW PAYMENT',tab:'overview'};if(c.audit.status==='Submitted')return{severity:'',text:`Business audit submitted ${c.audit.submittedAt}. Support plan due in ${c.audit.deadlineHoursLeft}h.`,cta:'OPEN AUDIT',tab:'audit'};if(c.audit.status==='Not Sent')return{severity:'amber',text:`No business audit has been sent yet.`,cta:'SEND AUDIT',tab:'audit'};if(c.checkIn.status==='Overdue')return{severity:'',text:`Monthly check-in is overdue.`,cta:'FOLLOW UP',tab:'check-ins'};if(c.powerSession.status==='Needs Booking')return{severity:'amber',text:`Power Session has not been booked.`,cta:'BOOK SESSION',tab:'power-sessions'};return{severity:'green',text:`No outstanding action — this record is on track.`,cta:'',tab:'overview'};}
function renderProfileTab(c){const t=state.profileTab;if(t==='overview'){return `<div class="card"><h3>Journey Status</h3><div class="kv"><div class="item"><div class="k">Enrolment</div><div class="v">${c.enrolledDaysAgo} days ago</div></div><div class="item"><div class="k">Payment status</div><div class="v"><span class="badge ${statusBadgeClass(c.payment)}">${c.payment}</span></div></div><div class="item"><div class="k">Business audit</div><div class="v"><span class="badge ${statusBadgeClass(c.audit.status)}">${c.audit.status}</span></div></div><div class="item"><div class="k">Support plan</div><div class="v"><span class="badge ${statusBadgeClass(c.supportPlan.status)}">${c.supportPlan.status}</span></div></div><div class="item"><div class="k">Monthly check-in</div><div class="v"><span class="badge ${statusBadgeClass(c.checkIn.status)}">${c.checkIn.status}</span></div></div><div class="item"><div class="k">Power Session</div><div class="v"><span class="badge ${statusBadgeClass(c.powerSession.status)}">${c.powerSession.status}</span></div></div></div></div><div class="card"><h3>Recent Activity</h3>${activityLog.filter(a=>a.text.includes(c.name.split(' (')[0])).slice(0,5).map(a=>`<div class="log-row"><div class="log-time">${a.time}</div><div>${a.text}</div></div>`).join('')||'<div class="empty-state">No logged activity for this record yet.</div>'}</div>`;}if(t==='audit'){return `<div class="card"><h3>Business Audit</h3><div class="kv"><div class="item"><div class="k">Status</div><div class="v"><span class="badge ${statusBadgeClass(c.audit.status)}">${c.audit.status}</span></div></div><div class="item"><div class="k">Submitted</div><div class="v">${c.audit.submittedAt||'—'}</div></div><div class="item"><div class="k">72-hour window</div><div class="v">${c.audit.deadlineHoursLeft!=null?c.audit.deadlineHoursLeft+'h remaining':'—'}</div></div><div class="item"><div class="k">Reviewer</div><div class="v">${findTeam(c.assigned).name}</div></div></div></div><div class="placeholder-block"><div class="pt">Full audit responses aren't wired up yet</div><div class="ps">This will display the actual submitted audit form once the audit intake is confirmed and connected. Phase 2 build.</div></div>`;}if(t==='support-plan'){return `<div class="card"><h3>Goals</h3>${c.supportPlan.goals.length?c.supportPlan.goals.map(g=>`<div class="task-row"><div class="task-title">${g.goal} <span style="color:var(--text-faint)">— target ${g.target}</span></div><span class="priority-tag ${g.priority}">${g.priority}</span><span class="badge ${statusBadgeClass(g.status)}">${g.status}</span></div>`).join(''):`<div class="empty-state">No goals set yet.</div>`}</div><div class="placeholder-block"><div class="pt">Action-item tracking is Phase 2</div><div class="ps">Owners, due dates and completion tracking build on top of this goals view.</div></div>`;}if(t==='check-ins'){return `<div class="card"><h3>Monthly Check-In</h3><div class="kv"><div class="item"><div class="k">Status</div><div class="v"><span class="badge ${statusBadgeClass(c.checkIn.status)}">${c.checkIn.status}</span></div></div></div></div><div class="placeholder-block"><div class="pt">Check-in submission history is Phase 2</div><div class="ps">Full check-in form responses, priority flags, and follow-up tracking build here once the check-in intake is connected.</div></div>`;}if(t==='power-sessions'){return `<div class="card"><h3>Power Sessions</h3><div class="kv"><div class="item"><div class="k">Status</div><div class="v"><span class="badge ${statusBadgeClass(c.powerSession.status)}">${c.powerSession.status}</span></div></div></div></div><div class="placeholder-block"><div class="pt">Calendar &amp; booking is Phase 2</div><div class="ps">Needs Google Calendar credentials, not yet provided.</div></div>`;}if(t==='notes'){return `<div class="card"><h3>Notes</h3><div id="notes-list">${c.notes.length?c.notes.map(n=>`<div class="note">${n.text}<div class="note-meta">${n.author} · ${n.when}</div></div>`).join(''):`<div class="empty-state">No notes yet.</div>`}</div><div class="note-input"><textarea id="new-note" placeholder="Add a note about ${c.name.split(' (')[0]}…"></textarea><button class="btn primary" id="save-note">Save</button></div></div>`;}return'';}
function renewalState(days){if(days==null)return{key:'missing',label:'Missing Date',cls:'neutral'};if(days<0)return{key:'overdue',label:'Overdue',cls:'red'};if(days<=7)return{key:'critical',label:'Critical',cls:'red'};if(days<=30)return{key:'next30',label:'Next 30 Days',cls:'amber'};if(days<=60)return{key:'next60',label:'Next 60 Days',cls:'amber'};if(days<=90)return{key:'next90',label:'Next 90 Days',cls:'neutral'};return{key:'continuity',label:'Continuity',cls:'green'};}
function moneyText(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function formatMoney(amount,currency){if(amount==null||amount===''||!Number.isFinite(Number(amount)))return'—';try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:currency||'AUD'}).format(Number(amount));}catch(e){return `${currency||'AUD'} ${Number(amount).toFixed(2)}`;}}
function renderMoney(){const active=paymentEvents.filter(e=>e.access_active).length,review=paymentEvents.filter(e=>!e.access_active).length,total=paymentEvents.filter(e=>e.access_active&&e.amount!=null).reduce((sum,e)=>sum+Number(e.amount||0),0);return `<div class="topline"><div><h1>Money</h1><div class="meta">Live Stripe and Shopify payment events received through Make</div></div></div><div class="scope-grid"><div class="scope-card"><div class="scope-num">${paymentEvents.length}</div><div class="scope-label">Payment Events</div><div class="scope-sub">Latest 250 events</div></div><div class="scope-card"><div class="scope-num">${active}</div><div class="scope-label">Access Activated</div><div class="scope-sub">Successful payments</div></div><div class="scope-card"><div class="scope-num">${review}</div><div class="scope-label">Needs Review</div><div class="scope-sub">Payment follow-up</div></div><div class="scope-card"><div class="scope-num">${formatMoney(total,'AUD')}</div><div class="scope-label">Recorded Value</div><div class="scope-sub">Successful loaded events</div></div></div><table><thead><tr><th>Received</th><th>Student</th><th>Event</th><th>Status</th><th>Amount</th><th>Access</th><th>Source</th></tr></thead><tbody>${paymentEvents.map(e=>{const c=findCustomer(e.student_id),status=e.subscription_status||e.payment_status||'received';return `<tr ${c?`data-nav="students" data-id="${c.id}"`:''}><td>${moneyText(e.created_at?new Date(e.created_at).toLocaleString('en-AU'):'—')}</td><td>${moneyText(c?c.name:'Unmatched student')}</td><td>${moneyText(e.event_type||'payment.updated')}</td><td><span class="badge ${e.access_active?'green':'red'}">${moneyText(status)}</span></td><td>${moneyText(formatMoney(e.amount,e.currency))}</td><td><span class="badge ${e.access_active?'green':'red'}">${e.access_active?'Active':'Review'}</span></td><td>${moneyText(e.stripe_subscription_id||e.stripe_customer_id||e.shopify_customer_id||'—')}</td></tr>`;}).join('')||'<tr><td colspan="7"><div class="empty-state">No payment events received yet.</div></td></tr>'}</tbody></table>`;}
function renderRenewals(){let list=customers.slice().sort((a,b)=>(a.renewalDaysLeft??999)-(b.renewalDaysLeft??999));const f=state.renewalFilter||'all';if(f!=='all')list=list.filter(c=>renewalState(c.renewalDaysLeft).key===f);const chips=[{k:'all',l:'All'},{k:'missing',l:'Missing Date'},{k:'overdue',l:'Overdue'},{k:'critical',l:'Critical'},{k:'next30',l:'Next 30 Days'},{k:'next60',l:'Next 60 Days'},{k:'next90',l:'Next 90 Days'},{k:'continuity',l:'Continuity'}];return `<div class="topline"><div><h1>Renewals</h1><div class="meta">Live renewal dates from student subscription records</div></div></div><div class="filter-row">${chips.map(c=>`<div class="chip ${f===c.k?'active':''}" data-renewalfilter="${c.k}">${c.l}</div>`).join('')}</div><table><thead><tr><th>Customer</th><th>Program</th><th>Level</th><th>Payment</th><th>Assigned</th><th>Renewal</th><th>Status</th></tr></thead><tbody>${list.map(c=>{const rs=renewalState(c.renewalDaysLeft),owner=findTeam(c.assigned);return `<tr data-nav="students" data-id="${c.id}"><td>${moneyText(c.name.split(' (')[0])}</td><td>${moneyText(c.program||'—')}</td><td>${moneyText(c.level||'—')}</td><td><span class="badge ${statusBadgeClass(c.payment)}">${moneyText(c.payment||'Pending')}</span></td><td>${moneyText(owner?owner.name:'Unassigned')}</td><td>${c.renewalDaysLeft==null?'—':c.renewalDaysLeft<0?`${Math.abs(c.renewalDaysLeft)}d overdue`:`${c.renewalDaysLeft}d left`}</td><td><span class="badge ${rs.cls}">${rs.label}</span></td></tr>`;}).join('')||'<tr><td colspan="7"><div class="empty-state">No renewal records match this filter.</div></td></tr>'}</tbody></table>`;}
function renderPlaceholderPage(title,note,phase){return `<div class="topline"><div><h1>${title}</h1><div class="meta">${phase||''}</div></div></div><div class="placeholder-block"><div class="pt">${title} isn't built out yet</div><div class="ps">${note}</div></div>`;}
function renderCheckins(){const list=customers.slice().sort((a,b)=>{const w=s=>s==='Overdue'?0:s==='Submitted'?1:2;return w(a.checkIn.status)-w(b.checkIn.status);});return `<div class="topline"><div><h1>Monthly Check-Ins</h1><div class="meta">Documents students submit each month</div></div></div><table><thead><tr><th>Student</th><th>Program</th><th>Level</th><th>Assigned</th><th>Document Status</th><th></th></tr></thead><tbody>${list.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${c.name.split(' (')[0]}</td><td>${c.program}</td><td><span class="badge ${c.level==='Level 2'?'amber':'neutral'}">${c.level}</span></td><td>${findTeam(c.assigned).name}</td><td><span class="badge ${statusBadgeClass(c.checkIn.status)}">${c.checkIn.status}</span></td><td>${c.checkIn.status!=='Not Due'?`<button class="btn small" data-nav="students" data-id="${c.id}">Review</button>`:''}</td></tr>`).join('')}</tbody></table><div class="placeholder-block" style="margin-top:16px;"><div class="pt">Full document submissions are Phase 2</div><div class="ps">This shows status only.</div></div>`;}
function renderRetention(){const atRisk=customers.filter(c=>c.board==='risk');const paymentIssues=customers.filter(c=>c.payment==='Failed');const f=state.retentionTab||'at-risk';const tabs=[{k:'at-risk',l:'At Risk',count:atRisk.length},{k:'payment',l:'Payment Issues',count:paymentIssues.length},{k:'cancellation',l:'Cancellation Requests',count:0},{k:'winback',l:'Win Back',count:0}];let rows=[];if(f==='at-risk')rows=atRisk;if(f==='payment')rows=paymentIssues;return `<div class="topline"><div><h1>Payment Management</h1><div class="meta">Payment issues, at-risk, cancellations and win-back</div></div></div><div class="filter-row">${tabs.map(t=>`<div class="chip ${f===t.k?'active':''}" data-retentiontab="${t.k}">${t.l}<span style="margin-left:6px;color:var(--text-faint)">${t.count}</span></div>`).join('')}</div>${(f==='at-risk'||f==='payment')?`<table><thead><tr><th>Student</th><th>Program</th><th>Assigned</th><th>Signal</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${c.name.split(' (')[0]}</td><td>${c.program}</td><td>${findTeam(c.assigned).name}</td><td>${f==='payment'?`<span class="badge red">Payment Failed</span>`:`<span class="badge amber">Multiple overdue actions</span>`}</td><td><button class="btn small" data-nav="students" data-id="${c.id}">Open</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty-state">Nobody in this category right now.</div></td></tr>`}</tbody></table>`:`<div class="empty-state">Needs a real signal once students can request cancellation in-portal or lapse past their renewal date.</div>`}`;}
function renderNotifications(){const items=getActionItems();return `<div class="topline"><div><h1>Notifications</h1><div class="meta">Everything that needs a look</div></div></div><div class="card">${items.length?items.map(it=>`<div class="na-row"><div class="init-avatar">${initials(findCustomer(it.target)?.name||'?')}</div><div style="flex:1"><div class="na-name">${it.title}</div><div class="na-reason">${it.sub}</div></div><button class="btn small" data-nav="students" data-id="${it.target}">Open</button></div>`).join(''):`<div class="empty-state">Nothing to notify you about.</div>`}</div>`;}
function renderCalls(){const list=customers.slice();return `<div class="topline"><div><h1>Power Sessions</h1><div class="meta">Monthly power session calls</div></div></div><table><thead><tr><th>Student</th><th>Coach / Advisor</th><th>Status</th><th></th></tr></thead><tbody>${list.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${c.name.split(' (')[0]}</td><td>${findTeam(c.assigned).name}</td><td><span class="badge ${statusBadgeClass(c.powerSession.status)}">${c.powerSession.status}</span></td><td>${c.powerSession.status==='Needs Booking'?`<button class="btn small" data-toast="Needs Google Calendar credentials.">Book</button>`:''}</td></tr>`).join('')}</tbody></table>`;}
async function findOrCreateConversation(studentId){let convo=conversations.find(c=>c.studentId===studentId);if(convo)return convo;const student=findCustomer(studentId);if(!student)return null;try{const{data,error}=await sb.from('conversations').insert({student_id:studentId,customer_name:student.name.split(' (')[0],status:'open'}).select('*, messages(*)').single();if(error)throw error;convo={id:data.id,studentId:data.student_id,name:data.customer_name,status:data.status,unreadForAdmin:data.unread_for_admin,assigned:data.assigned_to,thread:[]};conversations.unshift(convo);return convo;}catch(e){toast('Could not open conversation — '+(e.message||e));return null;}}
function commsSortWeight(c){if(c.status==='open'&&c.unreadForAdmin)return 0;if(c.status==='open')return 1;if(c.status==='pending')return 1;return 2;}
function commsStatusLabel(c){if(c.status==='open'&&c.unreadForAdmin)return'unread';if(c.status==='open')return'open';if(c.status==='pending')return'pending';if(c.status==='resolved')return'resolved';return c.status;}
function renderCommunications(){const list=conversations.slice().sort((a,b)=>commsSortWeight(a)-commsSortWeight(b));const openId=state.commsOpenId||(list[0]&&list[0].id);const open=conversations.find(c=>c.id===openId);const openStudent=open?findCustomer(open.studentId):null;return `<div class="topline"><div><h1>Communications</h1><div class="meta">Every student conversation, in one inbox</div></div></div><div class="conn-banner"><span class="conn-dot"></span><div class="conn-text"><b>Connected to:</b> Supabase, live. Conversations link to Shopify customers via <span class="mono">shopify_customer_id</span> where available. Native messaging replaces the earlier plan to mirror Shopify's inbox (no external API to pull threads from).</div></div><div class="comms-layout"><div class="comms-list">${list.map(c=>`<div class="comms-row ${c.id===openId?'active':''}" data-commsopen="${c.id}"><div class="init-avatar">${initials(c.name)}</div><div class="cr-body"><div class="cr-name">${c.name} ${commsStatusLabel(c)==='unread'?'<span class="unread-dot"></span>':''}</div><div class="cr-preview">${c.thread.length?(c.thread[c.thread.length-1].from==='team'?'You: ':'')+c.thread[c.thread.length-1].text:'No messages yet'}</div></div><div class="cr-time">${c.thread.length?c.thread[c.thread.length-1].time:''}</div></div>`).join('')||`<div class="empty-state">No conversations yet.</div>`}</div><div class="comms-thread">${open?`<div class="comms-thread-head"><div><div class="th-name">${open.name}</div><div class="th-sub">${openStudent?openStudent.business+' · ':''}assigned to ${open.assigned?findTeam(open.assigned).name:'Unassigned'} · <span class="badge ${commsStatusLabel(open)==='resolved'?'green':commsStatusLabel(open)==='unread'?'red':'amber'}">${commsStatusLabel(open)}</span></div></div>${openStudent?`<button class="btn small" data-nav="students" data-id="${openStudent.id}">Open profile</button>`:''}</div><div class="comms-msgs">${open.thread.length?open.thread.map(m=>`<div><div class="msg-bubble ${m.from}">${m.text}</div><div class="msg-time">${m.time}</div></div>`).join(''):`<div class="empty-state">No messages in this thread yet.</div>`}</div><div class="comms-reply"><input type="text" placeholder="Reply to ${open.name}…" id="comms-reply-input"/><button class="btn primary small" id="comms-reply-send">Send</button></div>`:`<div class="empty-state">Select a conversation.</div>`}</div></div>`;}
function renderTasks(){const open=tasks.filter(t=>!t.done);const done=tasks.filter(t=>t.done);return `<div class="topline"><div><h1>Tasks</h1><div class="meta">${open.length} open</div></div></div><div class="card"><h3>Open</h3>${open.length?open.map(t=>`<div class="task-row"><div class="task-check" data-task="${t.id}"></div><div class="task-title">${t.title}<div style="font-size:11px;color:var(--text-faint);margin-top:2px;">Due ${t.due} · ${findTeam(t.assigned).name}${t.client?` · <span data-nav="students" data-id="${t.client}" style="text-decoration:underline;cursor:pointer;">view record</span>`:''}</div></div><span class="priority-tag ${t.priority}">${t.priority}</span></div>`).join(''):'<div class="empty-state">Nothing outstanding.</div>'}</div><div class="card"><h3>Completed</h3>${done.length?done.map(t=>`<div class="task-row"><div class="task-check done" data-task="${t.id}"></div><div class="task-title done">${t.title}</div></div>`).join(''):'<div class="empty-state">Nothing completed yet.</div>'}</div>`;}
function renderActivity(){return `<div class="topline"><div><h1>Activity Log</h1><div class="meta">Every logged operational action</div></div></div><div class="card">${activityLog.map(a=>`<div class="log-row"><div class="log-time">${a.time}</div><div>${a.text} <span style="color:var(--text-faint)">— ${a.user}</span></div></div>`).join('')}</div>`;}
function renderTeam(){return `<div class="topline"><div><h1>Team</h1><div class="meta">${team.length} members</div></div></div><table><thead><tr><th>Name</th><th>Role</th><th>Assigned clients</th><th>Open tasks</th></tr></thead><tbody>${team.map(t=>`<tr><td>${t.name}</td><td>${t.role}</td><td>${customers.filter(c=>c.assigned===t.id).length}</td><td>${tasks.filter(k=>k.assigned===t.id&&!k.done).length}</td></tr>`).join('')}</tbody></table><div class="placeholder-block" style="margin-top:16px;"><div class="pt">Role-based permissions are Phase 1 backend work</div><div class="ps">Owner/Admin, Operations, Coach/Advisor and Content Manager roles need server-side authorization once this moves off a static demo.</div></div>`;}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-raised);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.4);';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>{t.style.opacity='0';},2600);}
function renderMain(){const v=state.route.view;if(v==='dashboard')return renderDashboard();if(v==='checkins')return renderCheckins();if(v==='retention')return renderRetention();if(v==='money')return renderMoney();if(v==='notifications')return renderNotifications();if(v==='calls')return renderCalls();if(v==='community')return renderPlaceholderPage('Community','Not built into the front-end platform yet.','Waiting on Donamae');if(v==='lib-programs')return renderPlaceholderPage('Programs','Program → Module → Lesson hierarchy.','Phase 4');if(v==='lib-levels')return renderPlaceholderPage('Levels','Level 1 ($199/wk) and Level 2 (+$99/wk) content and access rules.','Phase 4');if(v==='lib-resources')return renderPlaceholderPage('Resources','PDFs, videos, templates, guides.','Phase 4');if(v==='lib-classroom')return renderPlaceholderPage('Classroom','Lesson playback / classroom view.','Phase 4');if(v==='lib-forms')return renderPlaceholderPage('Forms','Likely where the Business Audit intake form lives.','Phase 2');if(v==='lib-questionnaires')return renderPlaceholderPage('Questionnaires','Monthly check-in questionnaire.','Phase 2');if(v==='shopify-customers')return renderShopifyCustomers();if(v==='analytics')return renderPlaceholderPage('Analytics','Needs real historical data.','Phase 6');if(v==='referral-inbox')return renderPlaceholderPage('Referral Inbox','Not in original BTM spec — confirm with Bree.','Not yet scoped');if(v==='academy')return renderPlaceholderPage("Educator's Pathway",'Focuses on the Educator\u2019s Pathway offer ($1,200–$1,400 one-off).','Phase 4');if(v==='settings')return renderPlaceholderPage('Settings','Role permissions, team management.','Phase 1 backend');if(v==='students')return state.route.id?renderProfile(state.route.id):renderStudents();if(v==='communications')return renderCommunications();if(v==='renewals')return renderRenewals();if(v==='tasks')return renderTasks();if(v==='activity')return renderActivity();if(v==='team')return renderTeam();return renderDashboard();}
function render(){if(!session){document.getElementById('app').innerHTML=renderLogin();bindLoginEvents();return;}if(state.loading){document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;width:100%;background:var(--bg);color:var(--text-dim);font-size:14px;">Loading BTM Operations HQ…</div>`;return;}if(state.loadError){document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;width:100%;background:var(--bg);color:var(--red);font-size:14px;text-align:center;padding:40px;">Couldn't load data from Supabase.<br><span style="color:var(--text-faint);font-size:12px;">${state.loadError}</span><br><br>${state.loadError.includes('is_current_user_admin')||state.loadError.toLowerCase().includes('permission')||state.loadError.toLowerCase().includes('policy')?'<span style="color:var(--text-faint);font-size:12px;">Your email may not be on the BTM Operations team list yet.</span>':''}</div>`;return;}document.getElementById('app').innerHTML=`${renderNav()}<div id="main">${renderMain()}</div>`;bindEvents();}
function bindLoginEvents(){const sendBtn=document.getElementById('login-send');if(sendBtn){sendBtn.addEventListener('click',async()=>{const emailInput=document.getElementById('login-email');const email=emailInput.value.trim();if(!email){authError='Enter your email first.';render();return;}authError=null;sendBtn.textContent='Sending…';sendBtn.disabled=true;try{const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.origin}});if(error)throw error;state.magicLinkSent=true;state.magicLinkSentTo=email;}catch(e){authError=e.message||String(e);}render();});}}
function bindEvents(){const shopifyRefresh=document.querySelector('[data-shopifyrefresh]');if(shopifyRefresh){shopifyRefresh.addEventListener('click',()=>{shopifyCustomers=null;shopifyLoadError=null;loadShopifyCustomers();});}const signOutBtn=document.getElementById('signout-btn');if(signOutBtn){signOutBtn.addEventListener('click',async()=>{await sb.auth.signOut();});}document.querySelectorAll('[data-nav]').forEach(node=>{node.addEventListener('click',async(e)=>{const view=node.getAttribute('data-nav');const id=node.getAttribute('data-id');const filter=node.getAttribute('data-filter');const commsjump=node.getAttribute('data-commsjump');if(view==='students'&&!id)state.studentFilter=filterMap(filter);if(commsjump){const convo=await findOrCreateConversation(commsjump);if(convo)state.commsOpenId=convo.id;}go(view,id);});});document.querySelectorAll('[data-studentfilter]').forEach(node=>{node.addEventListener('click',()=>{state.studentFilter=node.getAttribute('data-studentfilter');render();});});document.querySelectorAll('[data-renewalfilter]').forEach(node=>{node.addEventListener('click',()=>{state.renewalFilter=node.getAttribute('data-renewalfilter');render();});});document.querySelectorAll('[data-retentiontab]').forEach(node=>{node.addEventListener('click',()=>{state.retentionTab=node.getAttribute('data-retentiontab');render();});});document.querySelectorAll('[data-commsopen]').forEach(node=>{node.addEventListener('click',async()=>{const id=node.getAttribute('data-commsopen');state.commsOpenId=id;const convo=conversations.find(c=>c.id===id);if(convo&&convo.unreadForAdmin){convo.unreadForAdmin=false;try{await sb.from('conversations').update({unread_for_admin:false}).eq('id',id);}catch(e){}}render();});});const commsSend=document.getElementById('comms-reply-send');if(commsSend){commsSend.addEventListener('click',async()=>{const input=document.getElementById('comms-reply-input');const convo=conversations.find(c=>c.id===state.commsOpenId);const text=input.value.trim();if(text&&convo){convo.thread.push({from:'team',text,time:'Just now'});render();try{await sb.from('messages').insert({conversation_id:convo.id,sender_type:'admin',sender_name:'Christine',body:text});await sb.from('conversations').update({status:'open',unread_for_student:true,unread_for_admin:false,updated_at:new Date().toISOString()}).eq('id',convo.id);convo.status='open';const studentName=convo.name;logActivity(`Replied to ${studentName} in Communications`,'Christine',convo.studentId);}catch(e){toast('Failed to send — '+(e.message||e));}}});}const search=document.getElementById('student-search');if(search){search.addEventListener('input',(e)=>{state.studentSearch=e.target.value;render();document.getElementById('student-search').focus();document.getElementById('student-search').selectionStart=document.getElementById('student-search').value.length;});}document.querySelectorAll('[data-tab]').forEach(node=>{node.addEventListener('click',()=>{state.profileTab=node.getAttribute('data-tab');render();});});document.querySelectorAll('[data-tabjump]').forEach(node=>{node.addEventListener('click',()=>{state.profileTab=node.getAttribute('data-tabjump');render();});});document.querySelectorAll('[data-toggle]').forEach(node=>{node.addEventListener('click',(e)=>{e.stopPropagation();const key=node.getAttribute('data-toggle');state.collapsed[key]=!state.collapsed[key];render();});});document.querySelectorAll('[data-navtoggle]').forEach(node=>{node.addEventListener('click',(e)=>{e.stopPropagation();const key=node.getAttribute('data-navtoggle');state.navExpanded[key]=!navExpanded(key);render();});});document.querySelectorAll('[data-toast]').forEach(node=>{node.addEventListener('click',()=>toast(node.getAttribute('data-toast')));});document.querySelectorAll('[data-task]').forEach(node=>{node.addEventListener('click',async()=>{const id=node.getAttribute('data-task');const task=tasks.find(t=>t.id===id);task.done=!task.done;render();try{await sb.from('tasks').update({done:task.done,completed_at:task.done?new Date().toISOString():null}).eq('id',id);logActivity(`Task "${task.title}" marked ${task.done?'complete':'open'}`,'Christine',task.client);}catch(e){task.done=!task.done;render();toast('Failed to save — '+(e.message||e));}});});const saveNote=document.getElementById('save-note');if(saveNote){saveNote.addEventListener('click',async()=>{const ta=document.getElementById('new-note');const body=ta.value.trim();if(body){const c=findCustomer(state.route.id);c.notes.unshift({text:body,author:'Christine',when:'Just now'});render();try{await sb.from('notes').insert({student_id:c.id,author_name:'Christine',body});logActivity(`Note added to ${c.name.split(' (')[0]}'s profile`,'Christine',c.id);}catch(e){toast('Failed to save note — '+(e.message||e));}}});}}
function filterMap(f){if(f==='audit-pending')return'audit-pending';if(f==='checkin-due')return'checkin-due';if(f==='session-pending')return'session-pending';if(f==='payment-issue')return'payment-issue';if(f==='new')return'new';return'all';}
state.loading=false; render();
sb.auth.onAuthStateChange((event,newSession)=>{session=newSession;if(window.location.hash)history.replaceState(null,'',window.location.pathname);if(session){state.magicLinkSent=false;loadAll();}else{render();}});
setInterval(async()=>{if(session&&!state.loading&&state.route.view==='communications'){try{const{data,error}=await sb.from('conversations').select('*, messages(*)').order('updated_at',{ascending:false});if(!error&&data){conversations=data.map(c=>({id:c.id,studentId:c.student_id,name:c.customer_name,status:c.status,unreadForAdmin:c.unread_for_admin,assigned:c.assigned_to,thread:(c.messages||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(m=>({from:m.sender_type==='admin'?'team':'student',text:m.body,time:relTime(m.created_at)}))}));render();}}catch(e){}}},5000);
</script>
