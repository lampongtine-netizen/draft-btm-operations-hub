async function refreshLiveConversations(){

function startCommunicationRealtime(){

    .on('postgres_changes',{event:'*',schema:'public',table:'conversations'},refreshLiveConversations)
    .on('postgres_changes',{event:'*',schema:'public',table:'messages'},refreshLiveConversations)
    .subscribe();

async function loadShopifyCustomers(){
  if(shopifyLoading) return;
  shopifyLoading=true; shopifyLoadError=null; render();
  try{
    const authHeaders={};
    if(!demoMode&&session?.access_token)authHeaders.Authorization=`Bearer ${session.access_token}`;
    const res = await fetch('/api/shopify/customers',{headers:authHeaders,credentials:'include'});
    const data = await res.json();
    if(!res.ok) throw new Error((data && (data.error || JSON.stringify(data.detail))) || 'Failed to load');

    shopifyFetchedAt = data.fetchedAt;
  }catch(e){ shopifyLoadError = e.message || String(e); }

}

function relTime(iso){if(!iso)return'—';const d=new Date(iso);const diffMs=Date.now()-d.getTime();const mins=Math.round(diffMs/60000);if(mins<1)return'Just now';if(mins<60)return `${mins}m ago`;const hrs=Math.round(mins/60);if(hrs<24)return hrs===1?'1 hour ago':`${hrs} hours ago`;const days=Math.round(hrs/24);if(days===1)return'Yesterday';if(days<7)return `${days} days ago`;return d.toLocaleDateString();}
function daysAgo(iso){if(!iso)return 0;return Math.floor((Date.now()-new Date(iso).getTime())/86400000);}
function daysUntil(dateStr){if(!dateStr)return null;return Math.ceil((new Date(dateStr).getTime()-Date.now())/86400000);}
function hoursUntil(iso){if(!iso)return null;return Math.max(0,Math.round((new Date(iso).getTime()-Date.now())/3600000));}
async function loadAll(){

      sb.from('admins').select('*').order('created_at'),
      sb.from('students').select('*, notes(*), support_plan_goals(*), access_entitlements(*)').order('created_at'),
      sb.from('tasks').select('*').order('created_at'),
      sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(50),
      sb.from('conversations').select('*, messages(*)').order('updated_at',{ascending:false}),
    ]);
    if(adminsRes.error)throw adminsRes.error; if(studentsRes.error)throw studentsRes.error; if(tasksRes.error)throw tasksRes.error; if(activityRes.error)throw activityRes.error; if(convosRes.error)throw convosRes.error;

      return {id:s.id,name:s.name,business:s.business||'—',email:s.email||'—',phone:s.phone||'—',program:s.program,level:s.level,access:(s.access_entitlements||[]).filter(x=>x.status==='active').map(x=>x.program),educatorPathway:s.educator_pathway,assigned:s.assigned_to,status:s.status,board:s.board,lastActivity:relTime(s.last_activity_at),enrolledDaysAgo:daysAgo(s.enrolled_at),renewalDaysLeft:daysUntil(s.renewal_date),onboarding:{purchase:true,access:(s.access_entitlements||[]).some(x=>x.status==='active'),onboarding:true,audit:s.audit_status==='Reviewed'?'ok':(s.audit_status==='Submitted'?'pending':'fail')},audit:{status:s.audit_status,submittedAt:s.audit_submitted_at?relTime(s.audit_submitted_at):null,deadlineHoursLeft:s.audit_deadline_at?hoursUntil(s.audit_deadline_at):null},supportPlan:{status:s.support_plan_status,goals},checkIn:{status:s.checkin_status},powerSession:{status:s.power_session_status},payment:s.payment_status,notes:notesArr};
    });
    tasks=tasksRes.data.map(t=>({id:t.id,title:t.title,client:t.student_id,assigned:t.assigned_to,priority:t.priority,due:t.due_date?new Date(t.due_date).toLocaleDateString():'—',done:t.done,kind:t.kind||'staff'}));
    activityLog=activityRes.data.map(a=>({time:relTime(a.created_at),text:a.text,user:a.actor_name||'Christine'}));
    conversations=mapApiConversations(convosRes.data);
    state.loading=false;
  }catch(err){state.loading=false;state.loadError=err.message||String(err);}
  render();
}

function renderStudents(){let list=customers.slice();const f=state.studentFilter;if(f==='needs-attention')list=list.filter(c=>c.board==='needs'||c.board==='risk');if(f==='new')list=list.filter(c=>c.enrolledDaysAgo<=7);if(f==='payment-issue')list=list.filter(c=>c.payment==='Failed');if(f==='audit-pending')list=list.filter(c=>c.audit.status==='Submitted'||c.audit.status==='Not Sent');if(f==='checkin-due')list=list.filter(c=>c.checkIn.status==='Overdue'||c.checkIn.status==='Submitted');if(f==='session-pending')list=list.filter(c=>c.powerSession.status==='Needs Booking');if(f==='level1')list=list.filter(c=>c.level==='Level 1');if(f==='level2')list=list.filter(c=>c.level==='Level 2');if(f==='educator-pathway')list=list.filter(c=>c.educatorPathway);if(state.studentSearch){const q=state.studentSearch.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(q)||c.business.toLowerCase().includes(q));}const chips=[{k:'all',l:'All'},{k:'needs-attention',l:'Needs Attention'},{k:'new',l:'New This Week'},{k:'level1',l:'Level 1'},{k:'level2',l:'Level 2'},{k:'educator-pathway',l:"Educator's Pathway"},{k:'payment-issue',l:'Payment Issue'},{k:'audit-pending',l:'Audit Pending'},{k:'checkin-due',l:'Check-in Due'},{k:'session-pending',l:'Power Session Pending'}];return `<div class="topline"><div><h1>Students</h1><div class="meta">${list.length} shown · ${customers.length} total</div></div></div><div class="filter-row">${chips.map(c=>`<div class="chip ${state.studentFilter===c.k?'active':''}" data-studentfilter="${c.k}">${c.l}</div>`).join('')}<input class="search-box" placeholder="Search name or business…" id="student-search" value="${state.studentSearch}"/></div><table><thead><tr><th>Student</th><th>Business</th><th>Program</th><th>Level</th><th>Payment</th><th>Audit</th><th>Check-in</th><th>Power Session</th><th>Last activity</th><th>Status</th></tr></thead><tbody>${list.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${c.name.split(' (')[0]}${c.educatorPathway?` <span class="badge neutral" style="font-size:10px;">Educator's Pathway</span>`:''}</td><td>${c.business}</td><td>${c.program}</td><td><span class="badge ${c.level==='Level 2'?'amber':'neutral'}">${c.level}</span></td><td><span class="badge ${statusBadgeClass(c.payment)}">${c.payment}</span></td><td><span class="badge ${statusBadgeClass(c.audit.status)}">${c.audit.status}</span></td><td><span class="badge ${statusBadgeClass(c.checkIn.status)}">${c.checkIn.status}</span></td><td><span class="badge ${statusBadgeClass(c.powerSession.status)}">${c.powerSession.status}</span></td><td>${c.lastActivity}</td><td><span class="badge ${statusBadgeClass(c.status)}">${c.status}</span></td></tr>`).join('')||`<tr><td colspan="10"><div class="empty-state">No records match this filter.</div></td></tr>`}</tbody></table>`;}
function renderProfile(id){const c=findCustomer(id);if(!c)return `<div class="empty-state">Record not found.</div>`;const nextAction=getNextAction(c);const tabs=['overview','audit','support-plan','check-ins','power-sessions','notes'];const tabLabels={overview:'Overview',audit:'Business Audit','support-plan':'Support Plan','check-ins':'Check-ins','power-sessions':'Power Sessions',notes:'Notes'};return `<div class="breadcrumb"><span data-nav="students">Students / Members</span> / ${escapeHtml(c.name)}</div><div class="profile-head"><div><h2 class="p-name">${escapeHtml(c.name)} ${demoMode?'<span class="demo-pill">Demo</span>':''}</h2><div class="p-biz">${escapeHtml(c.business)}</div><div class="p-contact">${escapeHtml(c.email)} · ${escapeHtml(c.phone)}</div><div class="profile-meta"><div class="m"><span class="k">Program</span>${escapeHtml(c.program)}</div><div class="m"><span class="k">Level</span>${escapeHtml(c.level)}</div><div class="m"><span class="k">Assigned to</span>${escapeHtml((findTeam(c.assigned)||{name:'Unassigned'}).name)}</div><div class="m"><span class="k">Last active</span>${escapeHtml(c.lastActivity)}</div><div class="m"><span class="k">Status</span><span class="badge ${statusBadgeClass(c.status)}">${escapeHtml(c.status)}</span></div></div></div><div class="profile-actions"><button class="btn" data-tabjump="notes">Add Note</button><button class="btn" data-tabjump="support-plan">Support Plan</button><button class="btn" data-tabjump="power-sessions">Power Session</button><button class="btn" data-nav="communications" data-commsjump="${c.id}">Send Message</button></div></div>${nextAction.text?`<div class="next-action ${nextAction.severity}"><div><div class="na-label">Next action</div><div class="na-text">${escapeHtml(nextAction.text)}</div></div><button class="btn primary small" data-tabjump="${nextAction.tab}">${escapeHtml(nextAction.cta)}</button></div>`:''}<div class="tabs">${tabs.map(t=>`<div class="tab ${state.profileTab===t?'active':''}" data-tab="${t}">${tabLabels[t]}</div>`).join('')}</div><div id="tab-content">${renderProfileTab(c)}</div>`;}
function getNextAction(c){if(c.payment==='Failed')return{severity:'',text:`Payment failed — access/payment status needs review before continuing advisory work.`,cta:'REVIEW PAYMENT',tab:'overview'};if(c.audit.status==='Submitted')return{severity:'',text:`Business audit submitted ${c.audit.submittedAt}. Support plan due in ${c.audit.deadlineHoursLeft}h.`,cta:'OPEN AUDIT',tab:'audit'};if(c.audit.status==='Not Sent')return{severity:'amber',text:`No business audit has been sent yet.`,cta:'SEND AUDIT',tab:'audit'};if(c.checkIn.status==='Overdue')return{severity:'',text:`Monthly check-in is overdue.`,cta:'FOLLOW UP',tab:'check-ins'};if(c.powerSession.status==='Needs Booking')return{severity:'amber',text:`Power Session has not been booked.`,cta:'BOOK SESSION',tab:'power-sessions'};return{severity:'green',text:`No outstanding action — this record is on track.`,cta:'',tab:'overview'};}
function renderProfileTab(c){const t=state.profileTab;if(t==='overview'){const p=studentProgress(c);return `<div class="card"><h3>Student Journey</h3><div class="kv"><div class="item"><div class="k">Enrolment</div><div class="v">${c.enrolledDaysAgo} days ago</div></div><div class="item"><div class="k">Payment</div><div class="v"><span class="badge ${statusBadgeClass(c.payment)}">${escapeHtml(c.payment)}</span></div></div><div class="item"><div class="k">Business Audit</div><div class="v"><span class="badge ${statusBadgeClass(c.audit.status)}">${escapeHtml(c.audit.status)}</span></div></div><div class="item"><div class="k">Support Plan</div><div class="v"><span class="badge ${statusBadgeClass(c.supportPlan.status)}">${escapeHtml(c.supportPlan.status)}</span></div></div><div class="item"><div class="k">Weekly Check-in</div><div class="v"><span class="badge ${statusBadgeClass(c.weeklyCheckin||c.checkIn.status)}">${escapeHtml(c.weeklyCheckin||c.checkIn.status)}</span></div></div><div class="item"><div class="k">Power Session</div><div class="v"><span class="badge ${statusBadgeClass(c.powerSession.status)}">${escapeHtml(c.powerSession.status)}</span></div></div></div><div style="margin-top:16px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>Overall progress</span><b>${p}%</b></div><div class="progress-bar"><div class="progress-fill" style="width:${p}%"></div></div></div></div>`;}if(t==='audit'){return `<div class="card"><h3>Business Audit</h3><div class="kv"><div class="item"><div class="k">Status</div><div class="v"><span class="badge ${statusBadgeClass(c.audit.status)}">${escapeHtml(c.audit.status)}</span></div></div><div class="item"><div class="k">Submitted</div><div class="v">${escapeHtml(c.audit.submittedAt||'—')}</div></div><div class="item"><div class="k">Support-plan window</div><div class="v">${c.audit.deadlineHoursLeft!=null?c.audit.deadlineHoursLeft+'h remaining':'Complete / not started'}</div></div><div class="item"><div class="k">Reviewer</div><div class="v">${escapeHtml((findTeam(c.assigned)||{name:'Unassigned'}).name)}</div></div></div>${demoMode?'<div class="section-note">Demo audit record shown for Bree review.</div>':''}</div>`;}if(t==='support-plan'){return `<div class="card"><div style="display:flex;justify-content:space-between"><h3>Support Plan</h3><span class="badge ${statusBadgeClass(c.supportPlan.status)}">${escapeHtml(c.supportPlan.status)}</span></div>${c.supportPlan.goals.length?c.supportPlan.goals.map(g=>`<div class="task-row"><div class="task-title">${escapeHtml(g.goal)} <span style="color:var(--text-faint)">— target ${escapeHtml(g.target||'—')}</span></div><span class="priority-tag ${String(g.priority).toLowerCase()}">${escapeHtml(g.priority)}</span><span class="badge ${statusBadgeClass(g.status)}">${escapeHtml(g.status)}</span></div>`).join(''):'<div class="empty-state">No support-plan goals recorded.</div>'}</div>`;}if(t==='check-ins'){const rows=checkins.filter(x=>x.studentId===c.id);return `<div class="card"><h3>Daily & Weekly Check-ins</h3>${rows.length?rows.map(x=>`<div class="report-row"><span><b>${escapeHtml(x.cadence)}</b><br><span class="meta">${escapeHtml(x.when)} · ${escapeHtml(x.note||'')}</span></span><span class="badge ${statusBadgeClass(x.status)}">${escapeHtml(x.status)}</span></div>`).join(''):`<div class="report-row"><span>Current check-in</span><span class="badge ${statusBadgeClass(c.checkIn.status)}">${escapeHtml(c.checkIn.status)}</span></div>`}</div>`;}if(t==='power-sessions'){return `<div class="card"><h3>Power Sessions</h3><div class="kv"><div class="item"><div class="k">Status</div><div class="v"><span class="badge ${statusBadgeClass(c.powerSession.status)}">${escapeHtml(c.powerSession.status)}</span></div></div><div class="item"><div class="k">Next session</div><div class="v">${escapeHtml(c.powerSession.date|| (c.powerSession.status==='Needs Booking'?'Needs booking':'To be scheduled'))}</div></div><div class="item"><div class="k">Advisor</div><div class="v">${escapeHtml((findTeam(c.assigned)||{name:'Unassigned'}).name)}</div></div></div>${c.powerSession.status==='Needs Booking'?'<button class="btn primary" data-toast="Power Session marked for booking follow-up.">Book Power Session</button>':''}</div>`;}if(t==='notes'){return `<div class="card"><h3>Notes</h3><div id="notes-list">${c.notes.length?c.notes.map(n=>`<div class="note">${escapeHtml(n.text)}<div class="note-meta">${escapeHtml(n.author)} · ${escapeHtml(n.when)}</div></div>`).join(''):'<div class="empty-state">No notes yet.</div>'}</div><div class="note-input"><textarea id="new-note" placeholder="Add a note about ${escapeHtml(c.name)}…"></textarea><button class="btn primary" id="save-note">Save</button></div></div>`;}return'';}
function renewalState(days){if(days==null)return{key:'missing',label:'Missing Date',cls:'neutral'};if(days<0)return{key:'overdue',label:'Overdue',cls:'red'};if(days<=7)return{key:'critical',label:'Critical',cls:'red'};if(days<=30)return{key:'next30',label:'Next 30 Days',cls:'amber'};if(days<=60)return{key:'next60',label:'Next 60 Days',cls:'amber'};if(days<=90)return{key:'next90',label:'Next 90 Days',cls:'neutral'};return{key:'continuity',label:'Continuity',cls:'green'};}
function renderRenewals(){let list=customers.slice().sort((a,b)=>(a.renewalDaysLeft??999)-(b.renewalDaysLeft??999));const f=state.renewalFilter||'all';if(f!=='all')list=list.filter(c=>renewalState(c.renewalDaysLeft).key===f);const chips=[{k:'all',l:'All'},{k:'missing',l:'Missing Date'},{k:'overdue',l:'Overdue'},{k:'critical',l:'Critical'},{k:'next30',l:'Next 30 Days'},{k:'next60',l:'Next 60 Days'},{k:'next90',l:'Next 90 Days'},{k:'continuity',l:'Continuity'}];const upsellTargets=customers.filter(c=>c.level==='Level 1'&&c.renewalDaysLeft<=30);return `<div class="topline"><div><h1>Renewals</h1><div class="meta">Sorted by days remaining</div></div></div><div class="demo-banner">⚠ Renewal dates below are demo values. Real renewal dates need to sync from Stripe subscription data once BTM's Stripe credentials are connected.</div>${upsellTargets.length?`<div class="urgent-banner" style="background:var(--amber-dim);border-color:#e8d5a8;"><div class="urgent-icon" style="background:var(--amber);">↑</div><div class="urgent-body"><div class="urgent-title">${upsellTargets.length} Level 1 student${upsellTargets.length===1?'':'s'} renewing within 30 days — good moment to pitch Scale Society (+$99/wk).</div><div class="urgent-chips">${upsellTargets.map(c=>`<span class="urgent-chip warn">${c.name.split(' (')[0]}, ${c.renewalDaysLeft}d</span>`).join('')}</div></div></div>`:''}<div class="filter-row">${chips.map(c=>`<div class="chip ${f===c.k?'active':''}" data-renewalfilter="${c.k}">${c.l}</div>`).join('')}</div><table><thead><tr><th>Customer</th><th>Program</th><th>Level</th><th>Payment</th><th>Assigned</th><th>Renewal</th><th>Status</th></tr></thead><tbody>${list.map(c=>{const rs=renewalState(c.renewalDaysLeft);return `<tr data-nav="students" data-id="${c.id}"><td>${c.name.split(' (')[0]}</td><td>${c.program}</td><td>${c.level}${c.level==='Level 1'?` <span style="color:var(--gold);font-size:11px;">· upsell target</span>`:''}</td><td><span class="badge ${statusBadgeClass(c.payment)}">${c.payment}</span></td><td>${findTeam(c.assigned).name}</td><td>${c.renewalDaysLeft==null?'—':c.renewalDaysLeft<0?`${Math.abs(c.renewalDaysLeft)}d overdue`:`${c.renewalDaysLeft}d left`}</td><td><span class="badge ${rs.cls}">${rs.label}</span></td></tr>`;}).join('')||`<tr><td colspan="7"><div class="empty-state">No records match this filter.</div></td></tr>`}</tbody></table>`;}

function renderPayments(){return `<div class="topline"><div><h1>Payments & Subscriptions</h1><div class="meta">Payment and subscription status across BTM students</div></div></div><table><thead><tr><th>Student</th><th>Program</th><th>Access</th><th>Payment status</th><th>Renewal</th></tr></thead><tbody>${customers.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.program||'—')}</td><td>${escapeHtml(c.level||'—')}</td><td><span class="badge ${statusBadgeClass(c.payment)}">${escapeHtml(c.payment)}</span></td><td>${c.renewalDaysLeft==null?'—':c.renewalDaysLeft+' days'}</td></tr>`).join('')}</tbody></table>`;}
function renderEnrolments(){return `<div class="topline"><div><h1>Enrolment & Access Levels</h1><div class="meta">Program enrolment and portal access</div></div></div><table><thead><tr><th>Student</th><th>Program</th><th>Level</th><th>Access</th><th>Status</th></tr></thead><tbody>${customers.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.program||'—')}</td><td><span class="badge neutral">${escapeHtml(c.level||'—')}</span></td><td>${escapeHtml((c.access||[c.program]).join(' · '))}</td><td><span class="badge green">${escapeHtml(c.status||'Active')}</span></td></tr>`).join('')}</tbody></table>`;}
function studentProgress(c){if(c.progress!=null)return c.progress;let n=0;if(c.onboarding&&c.onboarding.purchase)n+=15;if(c.onboarding&&c.onboarding.access)n+=15;if(c.audit&&c.audit.status==='Reviewed')n+=25;if(c.supportPlan&&c.supportPlan.status==='Active')n+=20;if(c.checkIn&&c.checkIn.status==='Submitted')n+=10;if(c.powerSession&&c.powerSession.status==='Booked')n+=15;return Math.min(100,n);}
function renderProgress(){return `<div class="topline"><div><h1>Student Progress</h1><div class="meta">Operational progress across onboarding, audit, plan, check-ins and Power Sessions</div></div></div><table><thead><tr><th>Student</th><th>Program</th><th>Progress</th><th>Current stage</th></tr></thead><tbody>${customers.map(c=>{const p=studentProgress(c);const stage=c.audit.status!=='Reviewed'?'Business Audit':c.supportPlan.status!=='Active'?'Support Plan':c.powerSession.status==='Needs Booking'?'Power Session':'Ongoing Support';return `<tr data-nav="students" data-id="${c.id}"><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.program||'—')}</td><td style="min-width:190px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px"><span>${p}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${p}%"></div></div></td><td>${stage}</td></tr>`;}).join('')}</tbody></table>`;}
function renderAudits(){return `<div class="topline"><div><h1>Business Audits</h1><div class="meta">Submission and review tracking</div></div></div><table><thead><tr><th>Student</th><th>Business</th><th>Status</th><th>Submitted</th><th>Support plan SLA</th></tr></thead><tbody>${customers.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.business||'—')}</td><td><span class="badge ${statusBadgeClass(c.audit.status)}">${escapeHtml(c.audit.status)}</span></td><td>${escapeHtml(c.audit.submittedAt||'—')}</td><td>${c.audit.deadlineHoursLeft!=null?c.audit.deadlineHoursLeft+'h remaining':'—'}</td></tr>`).join('')}</tbody></table>`;}
function renderSupportPlans(){return `<div class="topline"><div><h1>Support Plan Tracking</h1><div class="meta">Personalised plans, goals and review status</div></div></div>${customers.map(c=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h3 style="margin:0">${escapeHtml(c.name)}</h3><div class="meta">${escapeHtml(c.business||'—')} · ${escapeHtml(c.program||'—')}</div></div><span class="badge ${statusBadgeClass(c.supportPlan.status)}">${escapeHtml(c.supportPlan.status)}</span></div><div style="margin-top:12px">${(c.supportPlan.goals||[]).map(g=>`<div class="report-row"><span>${escapeHtml(g.goal)}</span><span class="badge neutral">${escapeHtml(g.status)}</span></div>`).join('')||'<div class="empty-state">No goals recorded.</div>'}</div></div>`).join('')}`;}
function renderCheckinsScope(){const rows=checkins.length?checkins:customers.map(c=>({studentId:c.id,cadence:'Weekly',status:c.checkIn.status,when:c.lastActivity,note:'Current check-in status'}));return `<div class="topline"><div><h1>Daily & Weekly Check-ins</h1><div class="meta">Student accountability and follow-up</div></div></div><table><thead><tr><th>Student</th><th>Cadence</th><th>Status</th><th>When</th><th>Notes</th></tr></thead><tbody>${rows.map(x=>{const c=findCustomer(x.studentId);return `<tr ${c?`data-nav="students" data-id="${c.id}"`:''}><td>${escapeHtml(c?c.name:'—')}</td><td>${escapeHtml(x.cadence)}</td><td><span class="badge ${statusBadgeClass(x.status)}">${escapeHtml(x.status)}</span></td><td>${escapeHtml(x.when||'—')}</td><td>${escapeHtml(x.note||'—')}</td></tr>`;}).join('')}</tbody></table>`;}
function renderTaskType(kind,title,subtitle){const list=tasks.filter(t=>kind==='student'?t.kind==='student':t.kind!=='student');const open=list.filter(t=>!t.done),done=list.filter(t=>t.done);return `<div class="topline"><div><h1>${title}</h1><div class="meta">${subtitle}</div></div></div><div class="card"><h3>Open</h3>${open.map(t=>`<div class="task-row"><div class="task-check" data-task="${t.id}"></div><div class="task-title">${escapeHtml(t.title)}<div style="font-size:11px;color:var(--text-faint);margin-top:2px">Due ${escapeHtml(t.due)} · ${escapeHtml((findTeam(t.assigned)||{name:'Unassigned'}).name)}${t.client?` · ${escapeHtml((findCustomer(t.client)||{name:'Student'}).name)}`:''}</div></div><span class="priority-tag ${t.priority}">${escapeHtml(t.priority)}</span></div>`).join('')||'<div class="empty-state">Nothing outstanding.</div>'}</div><div class="card"><h3>Completed</h3>${done.map(t=>`<div class="task-row"><div class="task-check done" data-task="${t.id}"></div><div class="task-title done">${escapeHtml(t.title)}</div></div>`).join('')||'<div class="empty-state">Nothing completed yet.</div>'}</div>`;}
function renderApprovals(){return `<div class="topline"><div><h1>Approval Tracking</h1><div class="meta">Plans, creatives and operational items awaiting review</div></div></div><table><thead><tr><th>Item</th><th>Owner</th><th>Type</th><th>Status</th><th>Updated</th></tr></thead><tbody>${approvals.map(a=>`<tr><td>${escapeHtml(a.item)}</td><td>${escapeHtml(a.owner)}</td><td>${escapeHtml(a.type)}</td><td><span class="badge ${a.status==='Approved'?'green':a.status==='Changes Requested'?'red':'amber'}">${escapeHtml(a.status)}</span></td><td>${escapeHtml(a.updated)}</td></tr>`).join('')||'<tr><td colspan="5">No approval records yet.</td></tr>'}</tbody></table>`;}
function renderReporting(){const active=customers.filter(c=>c.status==='Active').length;const current=customers.filter(c=>c.payment==='Current').length;const audits=customers.filter(c=>c.audit.status==='Reviewed').length;const plans=customers.filter(c=>c.supportPlan.status==='Active').length;return `<div class="topline"><div><h1>Reporting</h1><div class="meta">Operations snapshot for BTM</div></div></div><div class="report-grid"><div class="report-card"><h3>Student Operations</h3><div class="report-row"><span>Active students</span><b>${active}</b></div><div class="report-row"><span>Business audits reviewed</span><b>${audits}/${customers.length}</b></div><div class="report-row"><span>Support plans active</span><b>${plans}/${customers.length}</b></div><div class="report-row"><span>Power Sessions needing booking</span><b>${customers.filter(c=>c.powerSession.status==='Needs Booking').length}</b></div></div><div class="report-card"><h3>Payments & Support</h3><div class="report-row"><span>Payments current</span><b>${current}/${customers.length}</b></div><div class="report-row"><span>Payment issues</span><b>${customers.length-current}</b></div><div class="report-row"><span>Unread conversations</span><b>${conversations.filter(c=>c.unreadForAdmin).length}</b></div><div class="report-row"><span>Open staff tasks</span><b>${tasks.filter(t=>t.kind!=='student'&&!t.done).length}</b></div></div></div>${demoMode?'<div class="demo-mode-banner" style="margin-top:16px"><span>Demo reporting uses sample operational data for Bree\'s review. Live reporting will use connected BTM records.</span></div>':''}`;}

function renderPlaceholderPage(title,note){return `<div class="topline"><div><h1>${escapeHtml(title)}</h1></div></div><div class="card"><div class="section-note">${escapeHtml(note||'No records available.')}</div></div>`;}
function renderCheckins(){return renderCheckinsScope();}
function renderRetention(){const atRisk=customers.filter(c=>c.board==='risk');const paymentIssues=customers.filter(c=>c.payment==='Failed');const f=state.retentionTab||'at-risk';const tabs=[{k:'at-risk',l:'At Risk',count:atRisk.length},{k:'payment',l:'Payment Issues',count:paymentIssues.length},{k:'cancellation',l:'Cancellation Requests',count:0},{k:'winback',l:'Win Back',count:0}];let rows=[];if(f==='at-risk')rows=atRisk;if(f==='payment')rows=paymentIssues;return `<div class="topline"><div><h1>Payment Management</h1><div class="meta">Payment issues, at-risk, cancellations and win-back</div></div></div><div class="filter-row">${tabs.map(t=>`<div class="chip ${f===t.k?'active':''}" data-retentiontab="${t.k}">${t.l}<span style="margin-left:6px;color:var(--text-faint)">${t.count}</span></div>`).join('')}</div>${(f==='at-risk'||f==='payment')?`<table><thead><tr><th>Student</th><th>Program</th><th>Assigned</th><th>Signal</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${c.name.split(' (')[0]}</td><td>${c.program}</td><td>${findTeam(c.assigned).name}</td><td>${f==='payment'?`<span class="badge red">Payment Failed</span>`:`<span class="badge amber">Multiple overdue actions</span>`}</td><td><button class="btn small" data-nav="students" data-id="${c.id}">Open</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty-state">Nobody in this category right now.</div></td></tr>`}</tbody></table>`:`<div class="empty-state">Needs a real signal once students can request cancellation in-portal or lapse past their renewal date.</div>`}`;}
function renderNotifications(){const items=getActionItems();return `<div class="topline"><div><h1>Notifications</h1><div class="meta">Everything that needs a look</div></div></div><div class="card">${items.length?items.map(it=>`<div class="na-row"><div class="init-avatar">${initials(findCustomer(it.target)?.name||'?')}</div><div style="flex:1"><div class="na-name">${it.title}</div><div class="na-reason">${it.sub}</div></div><button class="btn small" data-nav="students" data-id="${it.target}">Open</button></div>`).join(''):`<div class="empty-state">Nothing to notify you about.</div>`}</div>`;}
function renderCalls(){const list=customers.slice();return `<div class="topline"><div><h1>Power Sessions</h1><div class="meta">Booking and session tracking</div></div></div><table><thead><tr><th>Student</th><th>Advisor</th><th>Status</th><th>Next session</th><th></th></tr></thead><tbody>${list.map(c=>`<tr data-nav="students" data-id="${c.id}"><td>${escapeHtml(c.name)}</td><td>${escapeHtml((findTeam(c.assigned)||{name:'Unassigned'}).name)}</td><td><span class="badge ${statusBadgeClass(c.powerSession.status)}">${escapeHtml(c.powerSession.status)}</span></td><td>${escapeHtml(c.powerSession.date||'—')}</td><td>${c.powerSession.status==='Needs Booking'?`<button class="btn small" data-toast="Power Session marked for booking follow-up.">Book</button>`:''}</td></tr>`).join('')}</tbody></table>`;}
async function findOrCreateConversation(studentId){let convo=conversations.find(c=>c.studentId===studentId);if(convo)return convo;const student=findCustomer(studentId);if(!student)return null;if(demoMode){convo={id:'demo-cv-'+studentId,studentId,name:student.name,status:'open',unreadForAdmin:false,assigned:student.assigned,thread:[]};conversations.unshift(convo);return convo;}try{const{data,error}=await sb.from('conversations').insert({student_id:studentId,customer_name:student.name.split(' (')[0],status:'open'}).select('*, messages(*)').single();if(error)throw error;convo={id:data.id,studentId:data.student_id,name:data.customer_name,status:data.status,unreadForAdmin:data.unread_for_admin,assigned:data.assigned_to,thread:[]};conversations.unshift(convo);return convo;}catch(e){toast('Could not open conversation — '+(e.message||e));return null;}}
function commsSortWeight(c){if(c.status==='open'&&c.unreadForAdmin)return 0;if(c.status==='open')return 1;if(c.status==='pending')return 1;return 2;}
function commsStatusLabel(c){if(c.status==='open'&&c.unreadForAdmin)return'unread';if(c.status==='open')return'open';if(c.status==='pending')return'pending';if(c.status==='resolved')return'resolved';return c.status;}
function renderCommunications(){
  if(demoMode) refreshDemoConversations();
  const list=conversations.slice().sort((a,b)=>commsSortWeight(a)-commsSortWeight(b));
  const openId=state.commsOpenId||(list[0]&&list[0].id);
  const open=conversations.find(c=>c.id===openId);
  if(open&&!state.commsOpenId)state.commsOpenId=open.id;
  const openStudent=open?findCustomer(open.studentId):null;
  const profile=state.replyAs==='bree'?'Bree Wilkinson':'BTM Support Team';
  return `<div class="topline"><div><h1>Communications</h1><div class="meta">Manage private student conversations with distinct Bree Wilkinson and BTM Support Team profiles.</div></div>${demoMode?`<span class="badge green">Shopify messaging ready</span>`:''}</div>${state.commsError?`<div class="empty-state" style="border-color:var(--red);color:var(--red);margin-bottom:12px;">Message sync error: ${escapeHtml(state.commsError)}</div>`:""}<div class="conn-banner"><span class="conn-dot"></span><div class="conn-text"><b>Connected:</b> Shopify member messaging → BTM Operations HQ. ${totalMessageCount()} messages across ${conversations.length} conversations.</div></div><div class="comms-layout"><div class="comms-list">${list.map(c=>`<div class="comms-row ${c.id===openId?'active':''}" data-commsopen="${c.id}"><div class="init-avatar">${initials(c.name)}</div><div class="cr-body"><div class="cr-name">${escapeHtml(c.name)} ${c.unreadForAdmin?'<span class="unread-dot"></span>':''}</div><div class="cr-preview">${c.thread.length?escapeHtml((c.thread[c.thread.length-1].from==='team'?(c.thread[c.thread.length-1].senderName||'BTM')+': ':'')+c.thread[c.thread.length-1].text):'No messages yet'}</div></div><div class="cr-time">${c.thread.length?escapeHtml(c.thread[c.thread.length-1].time):''}</div></div>`).join('')||'<div class="empty-state"><b>No conversations yet</b><br><span>Student conversations will appear here once messaging begins. Replies can be sent as Bree Wilkinson or BTM Support Team.</span></div>'}</div><div class="comms-thread">${open?`<div class="comms-thread-head"><div><div class="th-name">${escapeHtml(open.name)}</div><div class="th-sub">Member conversation · <span class="badge ${open.unreadForAdmin?'red':'green'}">${open.unreadForAdmin?'unread':'open'}</span></div></div></div><div class="comms-msgs">${open.thread.length?open.thread.map(m=>`<div><div class="msg-sender">${escapeHtml(m.from==='student'?open.name:(m.senderName||'BTM Support Team'))}</div><div class="msg-bubble ${m.from}">${escapeHtml(m.text)}</div><div class="msg-time">${escapeHtml(m.time||'Just now')}</div></div>`).join(''):'<div class="empty-state">No messages in this thread yet.</div>'}</div><div style="padding:12px 16px 0"><div class="reply-as"><label>Reply as</label><button class="profile-choice ${state.replyAs==='bree'?'active':''}" data-replyas="bree">Bree Wilkinson</button><button class="profile-choice ${state.replyAs==='support'?'active':''}" data-replyas="support">BTM Support Team</button></div></div><div class="comms-reply"><input type="text" placeholder="Reply to ${escapeHtml(open.name)} as ${profile}…" id="comms-reply-input"/><button class="btn primary small" id="comms-reply-send">Send</button></div>`:'<div class="empty-state"><b>No conversation selected</b><br><span>When a student sends a message, the thread and reply controls will appear here.</span></div>'}</div></div>`;
}
function renderTasks(){const open=tasks.filter(t=>!t.done);const done=tasks.filter(t=>t.done);return `<div class="topline"><div><h1>Tasks</h1><div class="meta">${open.length} open</div></div></div><div class="card"><h3>Open</h3>${open.length?open.map(t=>`<div class="task-row"><div class="task-check" data-task="${t.id}"></div><div class="task-title">${t.title}<div style="font-size:11px;color:var(--text-faint);margin-top:2px;">Due ${t.due} · ${findTeam(t.assigned).name}${t.client?` · <span data-nav="students" data-id="${t.client}" style="text-decoration:underline;cursor:pointer;">view record</span>`:''}</div></div><span class="priority-tag ${t.priority}">${t.priority}</span></div>`).join(''):'<div class="empty-state">Nothing outstanding.</div>'}</div><div class="card"><h3>Completed</h3>${done.length?done.map(t=>`<div class="task-row"><div class="task-check done" data-task="${t.id}"></div><div class="task-title done">${t.title}</div></div>`).join(''):'<div class="empty-state">Nothing completed yet.</div>'}</div>`;}
function renderActivity(){return `<div class="topline"><div><h1>Activity Log</h1><div class="meta">Every logged operational action</div></div></div><div class="card">${activityLog.map(a=>`<div class="log-row"><div class="log-time">${a.time}</div><div>${a.text} <span style="color:var(--text-faint)">— ${a.user}</span></div></div>`).join('')}</div>`;}
function renderTeam(){return `<div class="topline"><div><h1>Team Profiles</h1><div class="meta">BTM operations and Communications identities</div></div></div><table><thead><tr><th>Name</th><th>Role</th><th>Assigned students</th><th>Open staff tasks</th></tr></thead><tbody>${team.map(t=>`<tr><td>${escapeHtml(t.name)}</td><td>${escapeHtml(t.role)}</td><td>${customers.filter(c=>c.assigned===t.id).length}</td><td>${tasks.filter(k=>k.assigned===t.id&&k.kind!=='student'&&!k.done).length}</td></tr>`).join('')}</tbody></table><div class="card" style="margin-top:16px"><h3>Communications Profiles</h3><div class="report-row"><span><b>Bree Wilkinson</b><br><span class="meta">Founder / strategy replies</span></span><span class="badge green">Available</span></div><div class="report-row"><span><b>BTM Support Team</b><br><span class="meta">Implementation & follow-up replies</span></span><span class="badge green">Available</span></div></div>`;}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-raised);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.4);';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>{t.style.opacity='0';},2600);}
function renderMain(){const v=state.route.view;if(v==='dashboard')return renderDashboard();if(v==='communications')return renderCommunications();if(v==='shopify-customers')return renderShopifyCustomers();if(demoMode&&EMPTY_SECTION_COPY[v])return renderEmptySection(v);if(v==='students')return state.route.id?renderProfile(state.route.id):renderStudents();if(v==='payments')return renderPayments();if(v==='enrolments')return renderEnrolments();if(v==='progress')return renderProgress();if(v==='audits')return renderAudits();if(v==='support-plans')return renderSupportPlans();if(v==='checkins')return renderCheckinsScope();if(v==='calls')return renderCalls();if(v==='student-tasks')return renderTaskType('student','Student Tasks','Tasks assigned to students / members');if(v==='staff-tasks')return renderTaskType('staff','Staff Tasks','Internal BTM operations tasks');if(v==='approvals')return renderApprovals();if(v==='reporting')return renderReporting();if(v==='team')return renderTeam();return renderDashboard();}
function render(){if(!session){document.getElementById('app').innerHTML=renderLogin();bindLoginEvents();return;}if(state.loading){document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;width:100%;background:var(--bg);color:var(--text-dim);font-size:14px;">Loading BTM Operations HQ…</div>`;return;}if(state.loadError){document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;width:100%;background:var(--bg);color:var(--red);font-size:14px;text-align:center;padding:40px;">Couldn't load data from Supabase.<br><span style="color:var(--text-faint);font-size:12px;">${state.loadError}</span><br><br>${state.loadError.includes('is_current_user_admin')||state.loadError.toLowerCase().includes('permission')||state.loadError.toLowerCase().includes('policy')?'<span style="color:var(--text-faint);font-size:12px;">Your email may not be on the BTM Operations team list yet.</span>':''}</div>`;return;}document.getElementById('app').innerHTML=`${renderNav()}<div id="main">${renderMain()}</div>`;bindEvents();}
function bindLoginEvents(){const demoBtn=document.getElementById('demo-login');if(demoBtn){demoBtn.addEventListener('click',async()=>{const code=(document.getElementById('demo-code').value||'').trim();if(!code){authError='Enter Bree’s private demo access code.';render();return;}demoBtn.disabled=true;demoBtn.textContent='Opening…';try{await startDemoFromCode(code);}catch(e){authError=e.message||String(e);render();}});}const sendBtn=document.getElementById('login-send');if(sendBtn){sendBtn.addEventListener('click',async()=>{const emailInput=document.getElementById('login-email');const email=emailInput.value.trim();if(!email){authError='Enter your email first.';render();return;}authError=null;sendBtn.textContent='Sending…';sendBtn.disabled=true;try{const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.origin}});if(error)throw error;state.magicLinkSent=true;state.magicLinkSentTo=email;}catch(e){authError=e.message||String(e);}render();});}}
function bindEvents(){const shopifyRefresh=document.querySelector('[data-shopifyrefresh]');if(shopifyRefresh){shopifyRefresh.addEventListener('click',()=>{shopifyCustomers=null;shopifyLoadError=null;loadShopifyCustomers();});}const signOutBtn=document.getElementById('signout-btn');if(signOutBtn){signOutBtn.addEventListener('click',async()=>{if(demoMode){try{await fetch('/api/demo-logout',{method:'POST'});}catch(e){} demoMode=false;session=null;team=[];customers=[];tasks=[];activityLog=[];conversations=[];approvals=[];checkins=[];state.route={view:'dashboard',id:null};render();}else{await sb.auth.signOut();}});}document.querySelectorAll('[data-nav]').forEach(node=>{node.addEventListener('click',async(e)=>{const view=node.getAttribute('data-nav');const id=node.getAttribute('data-id');const filter=node.getAttribute('data-filter');const commsjump=node.getAttribute('data-commsjump');if(view==='students'&&!id)state.studentFilter=filterMap(filter);if(commsjump){const convo=await findOrCreateConversation(commsjump);if(convo)state.commsOpenId=convo.id;}go(view,id);});});document.querySelectorAll('[data-studentfilter]').forEach(node=>{node.addEventListener('click',()=>{state.studentFilter=node.getAttribute('data-studentfilter');render();});});document.querySelectorAll('[data-renewalfilter]').forEach(node=>{node.addEventListener('click',()=>{state.renewalFilter=node.getAttribute('data-renewalfilter');render();});});document.querySelectorAll('[data-retentiontab]').forEach(node=>{node.addEventListener('click',()=>{state.retentionTab=node.getAttribute('data-retentiontab');render();});});document.querySelectorAll('[data-commsopen]').forEach(node=>{node.addEventListener('click',async()=>{const id=node.getAttribute('data-commsopen');state.commsOpenId=id;const convo=conversations.find(c=>c.id===id);if(convo&&convo.unreadForAdmin){convo.unreadForAdmin=false;if(demoMode){try{await fetch('/api/admin/mark-read',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:id})});}catch(e){}}else{try{await sb.from('conversations').update({unread_for_admin:false}).eq('id',id);}catch(e){}}}render();});});document.querySelectorAll('[data-replyas]').forEach(node=>node.addEventListener('click',()=>{state.replyAs=node.getAttribute('data-replyas');render();}));const openStudentTest=document.getElementById('open-student-test');if(openStudentTest){openStudentTest.addEventListener('click',()=>window.open('/student-test.html','_blank'));}const commsSend=document.getElementById('comms-reply-send');if(commsSend){commsSend.addEventListener('click',async()=>{const input=document.getElementById('comms-reply-input');const convo=conversations.find(c=>c.id===state.commsOpenId);const text=input.value.trim();if(text&&convo){const senderName=state.replyAs==='bree'?'Bree Wilkinson':'BTM Support Team';convo.thread.push({from:'team',senderName,text,time:'Just now'});convo.unreadForAdmin=false;render();if(demoMode){try{const r=await fetch('/api/admin/reply',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:convo.id,message:text,replyAs:state.replyAs})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Failed to send');await refreshDemoConversations();}catch(e){toast('Failed to send — '+(e.message||e));}}else{try{await sb.from('messages').insert({conversation_id:convo.id,sender_type:'admin',sender_name:senderName,body:text});await sb.from('conversations').update({status:'open',unread_for_student:true,unread_for_admin:false,updated_at:new Date().toISOString()}).eq('id',convo.id);convo.status='open';logActivity(`Replied to ${convo.name} in Communications`,senderName,convo.studentId);}catch(e){toast('Failed to send — '+(e.message||e));}}}});}const search=document.getElementById('student-search');if(search){search.addEventListener('input',(e)=>{state.studentSearch=e.target.value;render();document.getElementById('student-search').focus();document.getElementById('student-search').selectionStart=document.getElementById('student-search').value.length;});}document.querySelectorAll('[data-tab]').forEach(node=>{node.addEventListener('click',()=>{state.profileTab=node.getAttribute('data-tab');render();});});document.querySelectorAll('[data-tabjump]').forEach(node=>{node.addEventListener('click',()=>{state.profileTab=node.getAttribute('data-tabjump');render();});});document.querySelectorAll('[data-toggle]').forEach(node=>{node.addEventListener('click',(e)=>{e.stopPropagation();const key=node.getAttribute('data-toggle');state.collapsed[key]=!state.collapsed[key];render();});});document.querySelectorAll('[data-navtoggle]').forEach(node=>{node.addEventListener('click',(e)=>{e.stopPropagation();const key=node.getAttribute('data-navtoggle');state.navExpanded[key]=!navExpanded(key);render();});});document.querySelectorAll('[data-toast]').forEach(node=>{node.addEventListener('click',()=>toast(node.getAttribute('data-toast')));});document.querySelectorAll('[data-task]').forEach(node=>{node.addEventListener('click',async()=>{const id=node.getAttribute('data-task');const task=tasks.find(t=>t.id===id);task.done=!task.done;render();if(demoMode){logActivity(`Task "${task.title}" marked ${task.done?'complete':'open'}`,currentActor(),task.client);}else{try{await sb.from('tasks').update({done:task.done,completed_at:task.done?new Date().toISOString():null}).eq('id',id);logActivity(`Task "${task.title}" marked ${task.done?'complete':'open'}`,currentActor(),task.client);}catch(e){task.done=!task.done;render();toast('Failed to save — '+(e.message||e));}}});});const saveNote=document.getElementById('save-note');if(saveNote){saveNote.addEventListener('click',async()=>{const ta=document.getElementById('new-note');const body=ta.value.trim();if(body){const c=findCustomer(state.route.id);const actor=currentActor();c.notes.unshift({text:body,author:actor,when:'Just now'});render();if(demoMode){logActivity(`Note added to ${c.name.split(' (')[0]}'s profile`,actor,c.id);}else{try{await sb.from('notes').insert({student_id:c.id,author_name:actor,body});logActivity(`Note added to ${c.name.split(' (')[0]}'s profile`,actor,c.id);}catch(e){toast('Failed to save note — '+(e.message||e));}}}});}}
function filterMap(f){if(f==='audit-pending')return'audit-pending';if(f==='checkin-due')return'checkin-due';if(f==='session-pending')return'session-pending';if(f==='payment-issue')return'payment-issue';if(f==='new')return'new';return'all';}
setInterval(()=>{if(demoMode)refreshDemoConversations();else if(session&&!state.loading)refreshLiveConversations();},3000);
state.loading=false; render();
(async()=>{const active=await checkDemoSession();if(!active){const {data}=await sb.auth.getSession();if(data&&data.session){session=data.session;startCommunicationRealtime();loadAll();}else{render();}}})();
sb.auth.onAuthStateChange((event,newSession)=>{if(demoMode)return;session=newSession;if(window.location.hash)history.replaceState(null,'',window.location.pathname);if(session){state.magicLinkSent=false;startCommunicationRealtime();loadAll();}else{if(commsChannel){sb.removeChannel(commsChannel);commsChannel=null;}render();}});
</script>
<script src="/operational.js"></script>
