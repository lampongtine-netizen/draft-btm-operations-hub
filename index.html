<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTM Operations HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* warm ivory canvas, black sidebar, gold/tan labels, teal hairline — matched to BTM member portal */
    --bg: #f1ece2;
    --surface: #ffffff;
    --surface-raised: #faf7ef;
    --border: #e4ddcc;
    --border-soft: #e9e2d2;
    --text: #201e1a;
    --text-dim: #6b6558;
    --text-faint: #9b9483;

    --sidebar-bg: #101010;
    --sidebar-surface: #1a1a1a;
    --sidebar-border: #2a2a28;
    --sidebar-text: #f1ece2;
    --sidebar-text-dim: #b5ad99;
    --sidebar-text-faint: #7a7466;

    --gold: #ad8a55;
    --gold-soft: #cbb383;
    --teal: #2f6e6b;

    --rose: #ad8a55;         /* primary accent = gold, replacing prior rose */
    --rose-dim: #cbb383;
    --rose-ink: #1c1712;      /* text on gold buttons */

    --green: #4c7d5e;
    --green-dim: #e4ecdf;
    --amber: #ad7f2c;
    --amber-dim: #f3e8cf;
    --red: #ac4c3c;
    --red-dim: #f5e0da;

    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',serif; font-weight:500; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{ background:var(--rose-dim); }

  #app{ display:flex; min-height:100vh; border-top:3px solid var(--teal); }

  /* ---------- NAV ---------- */
  #nav{
    width:248px; flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-border);
    display:flex; flex-direction:column;
    height:100vh; position:sticky; top:0;
  }
  .nav-brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--sidebar-border);
  }
  .nav-brand .mark{ font-size:20px; color:var(--sidebar-text); font-weight:600; letter-spacing:.01em; }
  .nav-brand .mark em{ font-style:italic; color:var(--gold-soft); }
  .nav-brand .sub{ font-size:10.5px; color:var(--sidebar-text-faint); margin-top:5px; letter-spacing:.1em; text-transform:uppercase; }
  .nav-search{ padding:14px 16px; border-bottom:1px solid var(--sidebar-border); }
  .nav-search input{
    width:100%; background:var(--sidebar-surface); border:1px solid var(--sidebar-border);
    border-radius:var(--radius-s); padding:7px 10px; color:var(--sidebar-text); font-size:12.5px;
    outline:none;
  }
  .nav-search input::placeholder{ color:var(--sidebar-text-faint); }
  .nav-search input:focus{ border-color:var(--gold); }
  .nav-scroll{ flex:1; overflow-y:auto; padding:10px 10px 20px; }
  .nav-group{ margin-bottom:2px; }
  .nav-group-label{
    font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--gold-soft);
    padding:14px 10px 6px; opacity:.85;
  }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border-radius:var(--radius-s); cursor:pointer;
    color:var(--sidebar-text-dim); font-size:13px; font-weight:500;
  }
  .nav-item:hover{ background:var(--sidebar-surface); color:var(--sidebar-text); }
  .nav-item.active{ background:var(--sidebar-surface); color:var(--sidebar-text); box-shadow:inset 2px 0 0 var(--gold); }
  .nav-item .count{ font-size:11px; color:var(--sidebar-text-faint); }
  .nav-item.disabled{ color:var(--sidebar-text-faint); cursor:default; }
  .nav-item.disabled:hover{ background:none; color:var(--sidebar-text-faint); }
  .nav-item.nav-parent{ font-weight:600; }
  .nav-caret{ font-size:11px; color:var(--sidebar-text-faint); transition:transform .12s; display:inline-block; }
  .nav-caret.open{ transform:rotate(180deg); }
  .nav-children{ display:flex; flex-direction:column; }
  .nav-item.nav-child{ padding-left:22px; font-weight:400; }
  .nav-phase-tag{
    font-size:9px; padding:1px 5px; border-radius:20px; border:1px solid var(--sidebar-border);
    color:var(--sidebar-text-faint); letter-spacing:.02em;
  }
  .nav-foot{
    padding:14px 16px; border-top:1px solid var(--sidebar-border);
    display:flex; align-items:center; gap:9px;
  }
  .avatar{
    width:28px; height:28px; border-radius:50%; background:var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--rose-ink);
    flex-shrink:0;
  }
  .nav-foot .who{ font-size:12.5px; font-weight:600; color:var(--sidebar-text); }
  .nav-foot .role{ font-size:10.5px; color:var(--sidebar-text-faint); }

  /* ---------- MAIN ---------- */
  #main{ flex:1; min-width:0; padding:32px 40px 60px; max-width:1180px; }
  .topline{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px;}
  .topline h1{ font-size:26px; margin:0; }
  .topline .meta{ color:var(--text-dim); font-size:13px; }
  .breadcrumb{ font-size:12px; color:var(--text-faint); margin-bottom:6px; }
  .breadcrumb span{ cursor:pointer; }
  .breadcrumb span:hover{ color:var(--text-dim); }

  .demo-banner{
    background:var(--amber-dim); border:1px solid #e8d5a8; color:var(--amber);
    font-size:11.5px; padding:7px 12px; border-radius:var(--radius-s); margin-bottom:22px;
    display:flex; gap:7px; align-items:center;
  }

  /* action cards row (legacy grid, kept for other views) */
  .action-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; margin-bottom:34px; }
  .action-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
    padding:14px 15px; cursor:pointer; transition:border-color .15s, transform .15s;
  }
  .action-card:hover{ border-color:var(--rose-dim); transform:translateY(-1px); }
  .action-card .num{ font-family:'Fraunces',serif; font-size:26px; line-height:1; }
  .action-card.red .num{ color:var(--red); }
  .action-card.amber .num{ color:var(--amber); }
  .action-card.green .num{ color:var(--green); }
  .action-card.neutral .num{ color:var(--text); }
  .action-card .label{ font-size:12px; color:var(--text-dim); margin-top:5px; }

  /* ---------- Coach-Vault-style dashboard header / pills / collapsible sections ---------- */
  .dash-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
  .dash-header h1{ font-size:30px; text-transform:uppercase; letter-spacing:.01em; margin:0; font-family:'Inter',sans-serif; font-weight:800; }
  .dash-header .meta{ color:var(--text-dim); font-size:13px; margin-top:4px; }
  .quick-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .qa-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:9px 15px; border-radius:8px; font-size:11.5px; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; cursor:pointer; white-space:nowrap;
  }
  .qa-btn:hover{ border-color:var(--gold); }
  .qa-btn.primary{ background:var(--rose); border-color:var(--rose); color:var(--rose-ink); }

  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .pill{
    display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:8px 15px 8px 9px; cursor:pointer; font-size:12.5px;
  }
  .pill:hover{ border-color:var(--gold); }
  .pill .pill-num{ font-weight:800; font-size:14px; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .pill.red .pill-num{ background:var(--red-dim); color:var(--red); }
  .pill.amber .pill-num{ background:var(--amber-dim); color:var(--amber); }
  .pill.neutral .pill-num{ background:var(--surface-raised); color:var(--text-dim); border:1px solid var(--border); }
  .pill .pill-label{ color:var(--text-dim); }
  .pill .pill-arrow{ color:var(--text-faint); margin-left:2px; }

  .urgent-banner{
    display:flex; align-items:center; gap:14px; background:var(--red-dim); border:1px solid #e2c3b8;
    border-left:4px solid var(--red); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:20px;
  }
  .urgent-icon{
    width:36px; height:36px; border-radius:9px; background:var(--red); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .urgent-body{ flex:1; min-width:0; }
  .urgent-title{ font-weight:700; font-size:14.5px; }
  .urgent-chips{ display:flex; gap:7px; margin-top:8px; flex-wrap:wrap; }
  .urgent-chip{ font-size:11px; padding:3px 9px; border-radius:20px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); }
  .urgent-chip.warn{ color:var(--amber); border-color:#e8d5a8; }
  .urgent-chip.crit{ color:var(--red); border-color:#e2c3b8; }

  .collapsible{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); margin-bottom:12px; overflow:hidden; }
  .collapsible-head{ display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer; }
  .collapsible-head:hover{ background:var(--surface-raised); }
  .chevron{ font-size:11px; color:var(--text-faint); width:12px; display:inline-block; transition:transform .12s; }
  .chevron.open{ transform:rotate(90deg); }
  .collapsible-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .collapsible-count{ font-size:11px; font-weight:700; background:var(--surface-raised); border:1px solid var(--border); color:var(--text-dim); border-radius:20px; padding:1px 8px; }
  .collapsible-count.hot{ background:var(--red-dim); color:var(--red); border-color:transparent; }
  .collapsible-hint{ margin-left:auto; font-size:11px; color:var(--text-faint); }
  .collapsible-body{ padding:0 16px 14px; }

  .init-avatar{
    width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; background:var(--surface-raised); border:1px solid var(--border); color:var(--text-dim);
  }
  .na-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--border-soft); }
  .na-row:first-child{ border-top:none; }
  .na-row .na-name{ font-weight:600; font-size:13.5px; }
  .na-row .na-reason{ font-size:12px; color:var(--red); margin-top:2px; }
  .na-actions{ display:flex; gap:7px; }

  .board-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--border-soft); }
  .board-row:first-child{ border-top:none; }
  .board-row .name{ font-weight:600; font-size:13.5px; flex:1; }
  .flag-dots{ display:flex; gap:3px; }
  .flag-dots span{ width:7px; height:7px; border-radius:50%; background:var(--border); }
  .flag-dots span.on{ background:var(--red); }
  .board-num{ font-weight:800; color:var(--red); width:16px; text-align:center; }
  .board-last{ color:var(--text-faint); font-size:12px; width:52px; text-align:right; }
  .board-foot{ text-align:center; padding-top:10px; font-size:12px; color:var(--text-dim); cursor:pointer; }
  .board-foot:hover{ color:var(--gold); }

  .team-bar-wrap{ padding:2px 0 4px; }
  .team-bar-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .role-tag{ font-size:10.5px; font-weight:700; color:var(--red); background:var(--red-dim); padding:2px 8px; border-radius:20px; }
  .attn-tag{ font-size:11px; font-weight:700; color:var(--amber); background:var(--amber-dim); padding:2px 9px; border-radius:20px; margin-left:auto; }
  .team-bar{ height:6px; border-radius:6px; overflow:hidden; display:flex; background:var(--border-soft); }
  .team-bar .seg.green{ background:var(--green); }
  .team-bar .seg.amber{ background:var(--amber); }
  .team-bar .seg.red{ background:var(--red); }

  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint);
    margin:32px 0 12px; display:flex; align-items:center; justify-content:space-between;
  }

  /* action required list */
  .req-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .req-row{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
    padding:12px 14px; display:flex; align-items:center; gap:12px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.red{ background:var(--red); box-shadow:0 0 0 4px var(--red-dim); }
  .dot.amber{ background:var(--amber); box-shadow:0 0 0 4px var(--amber-dim); }
  .dot.green{ background:var(--green); box-shadow:0 0 0 4px var(--green-dim); }
  .req-body{ flex:1; min-width:0; }
  .req-title{ font-size:13.5px; font-weight:500; }
  .req-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .btn{
    border:1px solid var(--border); background:var(--surface-raised); color:var(--text);
    padding:6px 12px; border-radius:var(--radius-s); font-size:12px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--rose-dim); }
  .btn.primary{ background:var(--rose); border-color:var(--rose); color:var(--rose-ink); }
  .btn.primary:hover{ background:var(--gold-soft); }
  .btn.ghost{ background:transparent; }
  .btn.small{ padding:4px 9px; font-size:11px; }
  .empty-state{
    border:1px dashed var(--border); border-radius:var(--radius-m); padding:22px;
    text-align:center; color:var(--text-faint); font-size:13px;
  }

  /* new students */
  .onboard-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .onboard-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:13px 14px; cursor:pointer; }
  .onboard-card:hover{ border-color:var(--rose-dim); }
  .onboard-card .name{ font-weight:600; font-size:13.5px; margin-bottom:8px; }
  .steps{ display:flex; flex-direction:column; gap:4px; }
  .step{ font-size:11.5px; display:flex; align-items:center; gap:6px; color:var(--text-dim); }
  .step .icon{ width:14px; text-align:center; font-size:11px; }
  .step.ok .icon{ color:var(--green); }
  .step.pending .icon{ color:var(--amber); }
  .step.fail .icon{ color:var(--red); }

  /* board columns */
  .board{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .board-col{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:12px; }
  .board-col h4{ margin:2px 4px 10px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .board-col.on-track h4{ color:var(--green); }
  .board-col.needs h4{ color:var(--amber); }
  .board-col.risk h4{ color:var(--red); }
  .board-card{
    background:var(--surface-raised); border:1px solid var(--border-soft); border-radius:var(--radius-s);
    padding:9px 10px; font-size:12.5px; margin-bottom:7px; cursor:pointer;
  }
  .board-card:hover{ border-color:var(--rose-dim); }
  .board-card .biz{ color:var(--text-faint); font-size:11px; margin-top:2px; }

  /* table */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);
    font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border-soft);
  }
  tbody td{ padding:11px 10px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover td{ background:var(--surface); }
  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:20px;
  }
  .badge.green{ background:var(--green-dim); color:var(--green); }
  .badge.amber{ background:var(--amber-dim); color:var(--amber); }
  .badge.red{ background:var(--red-dim); color:var(--red); }
  .badge.neutral{ background:var(--surface-raised); color:var(--text-dim); border:1px solid var(--border); }

  .filter-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .chip{
    padding:6px 13px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer;
    border:1px solid var(--border); color:var(--text-dim);
  }
  .chip:hover{ color:var(--text); }
  .chip.active{ background:var(--rose); border-color:var(--rose); color:var(--rose-ink); }
  .search-box{
    margin-left:auto; background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-s);
    padding:6px 11px; font-size:12.5px; color:var(--text); min-width:200px; outline:none;
  }
  .search-box:focus{ border-color:var(--rose-dim); }

  /* profile */
  .profile-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-l);
    padding:22px 24px; margin-bottom:18px; flex-wrap:wrap;
  }
  .profile-head .p-name{ font-size:22px; margin:0 0 4px; }
  .profile-head .p-biz{ color:var(--text-dim); font-size:13px; margin-bottom:2px; }
  .profile-head .p-contact{ color:var(--text-faint); font-size:12px; }
  .profile-meta{ display:flex; gap:26px; margin-top:14px; flex-wrap:wrap; }
  .profile-meta .m{ font-size:12px; }
  .profile-meta .m .k{ color:var(--text-faint); display:block; margin-bottom:2px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
  .profile-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .next-action{
    background:var(--red-dim); border:1px solid #4a2c26; border-radius:var(--radius-m);
    padding:14px 16px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .next-action.amber{ background:var(--amber-dim); border-color:#4a3d24; }
  .next-action.green{ background:var(--green-dim); border-color:#274539; }
  .next-action .na-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin-bottom:4px; }
  .next-action .na-text{ font-size:13.5px; }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border-soft); margin-bottom:20px; flex-wrap:wrap; }
  .tab{ padding:9px 14px; font-size:13px; font-weight:500; color:var(--text-faint); cursor:pointer; border-bottom:2px solid transparent; }
  .tab:hover{ color:var(--text-dim); }
  .tab.active{ color:var(--text); border-bottom-color:var(--rose); }

  .card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:16px 18px; margin-bottom:14px; }
  .card h3{ font-size:13px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); font-family:'Inter'; font-weight:600; }
  .kv{ display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; }
  .kv .item .k{ font-size:11px; color:var(--text-faint); margin-bottom:2px; }
  .kv .item .v{ font-size:13.5px; }

  .note{ padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
  .note:last-child{ border-bottom:none; }
  .note .note-meta{ font-size:11px; color:var(--text-faint); margin-top:4px; }
  .note-input{ display:flex; gap:8px; margin-top:12px; }
  .note-input textarea{
    flex:1; background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-s);
    color:var(--text); padding:8px 10px; font-family:inherit; font-size:12.5px; resize:vertical; min-height:36px;
  }

  .placeholder-block{
    border:1px dashed var(--border); border-radius:var(--radius-m); padding:40px 20px; text-align:center;
  }
  .placeholder-block .pt{ font-size:14px; color:var(--text-dim); margin-bottom:6px; }
  .placeholder-block .ps{ font-size:12px; color:var(--text-faint); max-width:420px; margin:0 auto; }

  .task-row{ display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--border-soft); }
  .task-row:last-child{ border-bottom:none; }

  /* ---------- Communications ---------- */
  .comms-layout{ display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start; }
  .comms-list{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); overflow:hidden; }
  .comms-row{ display:flex; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border-soft); cursor:pointer; align-items:flex-start; }

// ---------- DERIVED / ACTION-REQUIRED ITEMS ----------
function getActionItems(){
  const items = [];
  customers.forEach(c=>{
    if(c.audit.status==='Submitted' && c.audit.deadlineHoursLeft!=null){
      const urgent = c.audit.deadlineHoursLeft <= 24;
      items.push({
        severity: urgent?'red':'amber',
        title: `${c.name.split(' (')[0]}'s Business Audit was submitted ${c.audit.submittedAt}`,
        sub: `Personalised Support Plan due — ${c.audit.deadlineHoursLeft}h left on the 72-hour window`,
        action:'OPEN AUDIT', target:c.id
      });
    }
    if(c.audit.status==='Not Sent'){
      items.push({ severity:'amber', title:`${c.name.split(' (')[0]} has no Business Audit sent`, sub:'Enrolled but onboarding is stalled', action:'SEND AUDIT', target:c.id });
    }
    if(c.powerSession.status==='Needs Booking'){
      items.push({ severity:'amber', title:`${c.name.split(' (')[0]} has not booked their Power Session`, sub:c.business, action:'BOOK SESSION', target:c.id });
    }
    if(c.payment==='Failed'){
      items.push({ severity:'red', title:`${c.name.split(' (')[0]}'s payment failed`, sub:'Access/payment status needs review', action:'OPEN CUSTOMER', target:c.id });
    }
    if(c.checkIn.status==='Overdue'){
      items.push({ severity:'red', title:`${c.name.split(' (')[0]}'s monthly check-in is overdue`, sub:c.business, action:'OPEN CHECK-IN', target:c.id });
    }
  });
  return items;
}

  const items = getActionItems();

    paymentIssues: customers.filter(c=>c.payment==='Failed').length,
  };
}

function statusBadgeClass(s){
  if(['Completed','Reviewed','Active','Current','Submitted','Booked'].includes(s)) return 'green';
  if(['In Progress','Needs Booking','Sent','Started','Under Review'].includes(s)) return 'amber';

function navExpanded(key){
  return state.navExpanded[key] !== false; // default expanded, matches reference screenshot

function renderNav(){
  const rows = NAV.map(it=>{
    if(it.expandable){
      const open = navExpanded(it.key);
      const childRows = it.children.map(ch=>{
        const active = state.route.view===ch.key ? 'active':'';
        const count = ch.count ? ch.count() : null;
        return `<div class="nav-item nav-child ${active}" data-nav="${ch.key}">${ch.label}${count!=null?`<span class="count">${count}</span>`:''}</div>`;
      }).join('');
      return `
        <div class="nav-item nav-parent" data-navtoggle="${it.key}">${it.label}<span class="nav-caret ${open?'open':''}">⌃</span></div>
        ${open ? `<div class="nav-children">${childRows}</div>` : ''}
      `;
    }
    const active = state.route.view===it.key ? 'active':'';
    const count = it.count ? it.count() : null;
    return `<div class="nav-item ${active}" data-nav="${it.key}">${it.label}${count!=null?`<span class="count">${count}</span>`:''}</div>`;
  }).join('');

  return `

// ---------- STUDENTS LIST ----------
function renderStudents(){
  let list = customers.slice();
  const f = state.studentFilter;
  if(f==='needs-attention') list = list.filter(c=>c.board==='needs'||c.board==='risk');
  if(f==='new') list = list.filter(c=>c.enrolledDaysAgo<=7);
  if(f==='payment-issue') list = list.filter(c=>c.payment==='Failed');
  if(f==='audit-pending') list = list.filter(c=>c.audit.status==='Submitted'||c.audit.status==='Not Sent');
  if(f==='checkin-due') list = list.filter(c=>c.checkIn.status==='Overdue'||c.checkIn.status==='Submitted');
  if(f==='session-pending') list = list.filter(c=>c.powerSession.status==='Needs Booking');
  if(f==='level1') list = list.filter(c=>c.level==='Level 1');
  if(f==='level2') list = list.filter(c=>c.level==='Level 2');
  if(f==='educator-pathway') list = list.filter(c=>c.educatorPathway);
  if(state.studentSearch){
    const q = state.studentSearch.toLowerCase();
    list = list.filter(c=> c.name.toLowerCase().includes(q) || c.business.toLowerCase().includes(q));

  const chips = [

    {k:'payment-issue', l:'Payment Issue'},
    {k:'audit-pending', l:'Audit Pending'}, {k:'checkin-due', l:'Check-in Due'}, {k:'session-pending', l:'Power Session Pending'},

  return `
    <div class="topline"><div><h1>Students</h1><div class="meta">${list.length} shown · ${customers.length} total</div></div></div>

      ${chips.map(c=>`<div class="chip ${state.studentFilter===c.k?'active':''}" data-studentfilter="${c.k}">${c.l}</div>`).join('')}

      <thead><tr>
        <th>Student</th><th>Business</th><th>Program</th><th>Level</th><th>Payment</th><th>Audit</th><th>Check-in</th><th>Power Session</th><th>Last activity</th><th>Status</th>

function getNextAction(c){
  if(c.payment==='Failed') return { severity:'', text:`Payment failed — access/payment status needs review before continuing advisory work.`, cta:'REVIEW PAYMENT', tab:'overview' };
  if(c.audit.status==='Submitted') return { severity:'', text:`Business audit submitted ${c.audit.submittedAt}. Support plan due in ${c.audit.deadlineHoursLeft}h.`, cta:'OPEN AUDIT', tab:'audit' };
  if(c.audit.status==='Not Sent') return { severity:'amber', text:`No business audit has been sent yet.`, cta:'SEND AUDIT', tab:'audit' };
  if(c.checkIn.status==='Overdue') return { severity:'', text:`Monthly check-in is overdue.`, cta:'FOLLOW UP', tab:'check-ins' };
  if(c.powerSession.status==='Needs Booking') return { severity:'amber', text:`Power Session has not been booked.`, cta:'BOOK SESSION', tab:'power-sessions' };
  return { severity:'green', text:`No outstanding action — this record is on track.`, cta:'', tab:'overview' };
}

// ---------- RENEWALS ----------
function renewalState(days){
  if(days==null) return { key:'missing', label:'Missing Date', cls:'neutral' };
  if(days<0) return { key:'overdue', label:'Overdue', cls:'red' };
  if(days<=7) return { key:'critical', label:'Critical', cls:'red' };
  if(days<=30) return { key:'next30', label:'Next 30 Days', cls:'amber' };
  if(days<=60) return { key:'next60', label:'Next 60 Days', cls:'amber' };
  if(days<=90) return { key:'next90', label:'Next 90 Days', cls:'neutral' };
  return { key:'continuity', label:'Continuity', cls:'green' };
}

function renderRenewals(){
  let list = customers.slice().sort((a,b)=> (a.renewalDaysLeft??999) - (b.renewalDaysLeft??999));
  const f = state.renewalFilter || 'all';
  if(f!=='all') list = list.filter(c=> renewalState(c.renewalDaysLeft).key===f);

  const chips = [
    {k:'all', l:'All'}, {k:'missing', l:'Missing Date'}, {k:'overdue', l:'Overdue'},
    {k:'critical', l:'Critical'}, {k:'next30', l:'Next 30 Days'}, {k:'next60', l:'Next 60 Days'},
    {k:'next90', l:'Next 90 Days'}, {k:'continuity', l:'Continuity'},
  ];
  const upsellTargets = customers.filter(c=>c.level==='Level 1' && c.renewalDaysLeft<=30);

  return `
    <div class="topline"><div><h1>Renewals</h1><div class="meta">Sorted by days remaining · reach out before the renewal date, not after</div></div></div>

    <div class="demo-banner">⚠ Renewal dates below are demo values. Real renewal dates need to sync from Stripe subscription data once BTM's Stripe credentials are connected.</div>

    ${upsellTargets.length ? `
    <div class="urgent-banner" style="background:var(--amber-dim);border-color:#e8d5a8;">
      <div class="urgent-icon" style="background:var(--amber);">↑</div>
      <div class="urgent-body">
        <div class="urgent-title">${upsellTargets.length} Level 1 student${upsellTargets.length===1?'':'s'} renewing within 30 days — good moment to pitch Scale Society (+$99/wk on top of their existing $199/wk).</div>
        <div class="urgent-chips">${upsellTargets.map(c=>`<span class="urgent-chip warn">${c.name.split(' (')[0]}, ${c.renewalDaysLeft}d</span>`).join('')}</div>
      </div>
    </div>` : ''}

    <div class="filter-row">
      ${chips.map(c=>`<div class="chip ${f===c.k?'active':''}" data-renewalfilter="${c.k}">${c.l}</div>`).join('')}
    </div>

    <table>
      <thead><tr>
        <th>Customer</th><th>Program</th><th>Level</th><th>Payment</th><th>Assigned</th><th>Renewal</th><th>Status</th>
      </tr></thead>

        ${list.map(c=>{
          const rs = renewalState(c.renewalDaysLeft);

            <td>${c.program}</td>

            <td><span class="badge ${statusBadgeClass(c.payment)}">${c.payment}</span></td>
            <td>${findTeam(c.assigned).name}</td>
            <td>${c.renewalDaysLeft==null?'—':c.renewalDaysLeft<0?`${Math.abs(c.renewalDaysLeft)}d overdue`:`${c.renewalDaysLeft}d left`}</td>
            <td><span class="badge ${rs.cls}">${rs.label}</span></td>
          </tr>`;
        }).join('') || `<tr><td colspan="7"><div class="empty-state">No records match this filter.</div></td></tr>`}
      </tbody>
    </table>
  `;
}

function commsSortWeight(c){
  if(c.unread_for_admin) return 0;
  if(c.status==='pending') return 1;
  return 2;
}

let liveComms = {
  loaded:false,
  loading:false,
  authenticated:false,
  email:null,
  error:null,
  conversations:[],
  open:null,
  openMessages:[]
};

function esc(value){
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function formatCommsTime(value){
  if(!value) return '';
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return esc(value);
  return d.toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}

async function commsRequest(url, options={}){
  const response = await fetch(url, {credentials:'same-origin', ...options, headers:{'Content-Type':'application/json', ...(options.headers||{})}});
  let data = {};
  try { data = await response.json(); } catch {}
  if(!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  return data;
}

async function loadLiveCommunications(){
  if(liveComms.loading) return;
  liveComms.loading = true;
  liveComms.error = null;
  try{
    const me = await commsRequest('/api/auth/me');
    liveComms.authenticated = !!me.authenticated;
    liveComms.email = me.email || null;
    if(!liveComms.authenticated){
      liveComms.loaded = true;
    } else {
      const rows = await commsRequest('/api/conversations');
      liveComms.conversations = Array.isArray(rows) ? rows : [];
      liveComms.loaded = true;
      if(liveComms.conversations.length){
        const wanted = state.commsOpenId && liveComms.conversations.find(c=>c.id===state.commsOpenId);
        await openLiveConversation((wanted || liveComms.conversations[0]).id, false);
      }
    }
  }catch(e){
    liveComms.error = e.message || 'Unable to load Communications.';
    liveComms.loaded = true;
  }finally{
    liveComms.loading = false;
  }
  render();
}

async function openLiveConversation(id, rerender=true){
  try{
    const data = await commsRequest(`/api/conversations/${encodeURIComponent(id)}`);
    liveComms.open = data.conversation;
    liveComms.openMessages = data.messages || [];
    state.commsOpenId = id;
    await commsRequest(`/api/conversations/${encodeURIComponent(id)}`, {method:'PATCH', body:JSON.stringify({unread_for_admin:false})});
    const row = liveComms.conversations.find(c=>c.id===id);
    if(row) row.unread_for_admin = false;
  }catch(e){
    liveComms.error = e.message || 'Unable to open conversation.';
  }
  if(rerender) render();
}

function renderCommunications(){

    return `<div class="topline"><div><h1>Communications</h1><div class="meta">Every student conversation, in one inbox</div></div></div><div class="comms-loading">Connecting to the BTM messaging backend…</div>`;
  }
  if(!liveComms.authenticated) return renderCommsLogin();
  if(liveComms.error && !liveComms.open){
    return `<div class="topline"><div><h1>Communications</h1><div class="meta">Every student conversation, in one inbox</div></div></div><div class="comms-error"><b>Communications backend unavailable.</b><br>${esc(liveComms.error)}<br><br>Check the Vercel environment variables and Supabase setup, then refresh.</div>`;
  }

  const list = liveComms.conversations.slice().sort((a,b)=>commsSortWeight(a)-commsSortWeight(b));
  const open = liveComms.open;
  return `
    <div class="topline"><div><h1>Communications</h1><div class="meta">Every student conversation, in one inbox</div></div><div><span class="badge green">Backend connected</span></div></div>
    <div class="conn-banner">
      <span class="conn-dot" style="background:var(--green);box-shadow:0 0 0 3px var(--green-dim);"></span>
      <div class="conn-text"><b>BTM Messaging Backend</b> · ${esc(liveComms.email)}<br><span style="color:var(--text-faint)">Messages in this inbox are stored in the BTM communications database. Shopify Inbox is not being used as the backend.</span></div>
      <button class="btn small" id="comms-logout">Log out</button>
    </div>
    <div class="comms-layout">
      <div class="comms-list">
        ${list.map(c=>`
          <div class="comms-row ${c.id===state.commsOpenId?'active':''}" data-commsopen="${esc(c.id)}">
            <div class="init-avatar">${esc(initials(c.customer_name || 'BTM'))}</div>
            <div class="cr-body">
              <div class="cr-name">${esc(c.customer_name || 'BTM Student')} ${c.unread_for_admin?'<span class="unread-dot"></span>':''}</div>
              <div class="cr-preview">${esc(c.last_message ? (c.last_message.sender_type==='admin'?'You: ':'') + c.last_message.body : 'No messages yet')}</div>
            </div>
            <div class="cr-time">${formatCommsTime(c.updated_at)}</div>
          </div>`).join('') || `<div class="empty-state">No conversations yet.</div>`}
      </div>
      <div class="comms-thread">
        ${open ? `
          <div class="comms-thread-head">
            <div><div class="th-name">${esc(open.customer_name)}</div><div class="th-sub">${esc(open.customer_email || 'No email')} · <span class="badge ${open.status==='closed'?'neutral':open.status==='pending'?'amber':'green'}">${esc(open.status)}</span></div></div>
          </div>
          <div class="comms-msgs">
            ${liveComms.openMessages.length ? liveComms.openMessages.map(m=>`
              <div class="msg-bubble ${m.sender_type==='admin'?'team':'student'}"><div>${esc(m.body)}</div><div class="msg-time">${esc(m.sender_name)} · ${formatCommsTime(m.created_at)}</div></div>
            `).join('') : `<div class="empty-state">No messages yet.</div>`}
          </div>
          <div class="comms-reply">
            <input type="text" placeholder="Reply to ${esc(open.customer_name)}…" id="comms-reply-input" autocomplete="off" />
            <button class="btn primary small" id="comms-reply-send">Send</button>
          </div>
        ` : `<div class="empty-state">Select a conversation.</div>`}
      </div>
    </div>`;
}

// ---------- TOAST ----------
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-raised);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.4);';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ t.style.opacity='0'; }, 2600);
}

// ---------- MAIN RENDER ----------
function renderMain(){
  const v = state.route.view;

  if(v==='checkins') return renderCheckins();
  if(v==='retention') return renderRetention();
  if(v==='notifications') return renderNotifications();

  if(v==='lib-programs') return renderPlaceholderPage('Programs', 'Program → Module → Lesson hierarchy from the original spec. Builds once we know whether course content lives here or stays on the existing Skool-style student platform Donamae built.', 'Phase 4');
  if(v==='lib-levels') return renderPlaceholderPage('Levels', 'Level 1 (Business Advisory & Support, $199/wk) and Level 2 (Scale Society, +$99/wk) content and access rules, managed from here. Confirmed by Bree on the Sept 4 call as its own Library item, separate from Programs.', 'Phase 4');
  if(v==='lib-resources') return renderPlaceholderPage('Resources', 'PDFs, videos, templates, guides — the Resource Library from the master spec.', 'Phase 4');
  if(v==='lib-classroom') return renderPlaceholderPage('Classroom', 'Lesson playback / classroom view, mirrored from Coach Vault.', 'Phase 4');
  if(v==='lib-forms') return renderPlaceholderPage('Forms', 'This is likely where the Business Audit intake form lives once built — Bree described wanting the audit filled out directly in the portal.', 'Phase 2');
  if(v==='lib-questionnaires') return renderPlaceholderPage('Questionnaires', 'Monthly check-in questionnaire and any other structured intake forms.', 'Phase 2');
  if(v==='money') return renderPlaceholderPage('Money', 'Revenue, subscriptions, and payment status pulled from Stripe. Needs BTM\'s Stripe credentials — not yet provided. The Payment column on Students and Payment Management → Payment Issues already surface what we can see without it.', 'Phase 3');
  if(v==='analytics') return renderPlaceholderPage('Analytics', 'Student, advisory, retention and revenue analytics from the master spec. Needs real historical data — building this on demo data would produce fake metrics, which the build rules explicitly rule out.', 'Phase 6');
  if(v==='referral-inbox') return renderPlaceholderPage('Referral Inbox', 'Wasn\'t in the original BTM spec — carried over from the Coach Vault reference nav. Confirm with Bree what a "referral" means for BTM (student referrals? affiliate signups?) before building.', 'Not yet scoped');
  if(v==='academy') return renderPlaceholderPage("Educator's Pathway", 'Bree confirmed on the Sept 4 call this should focus on the Educator\'s Pathway offer (one-off $1,200–$1,400) rather than being a generic "Academy." Certificate-on-completion, course-build training, and workshop/event guidance go here once built.', 'Phase 4');
  if(v==='settings') return renderPlaceholderPage('Settings', 'Role permissions, team member management, and account settings. Team member data already exists — see Team in the Internal section for now.', 'Phase 1 backend');
  if(v==='students') return state.route.id ? renderProfile(state.route.id) : renderStudents();
  if(v==='communications') return renderCommunications();
  if(v==='renewals') return renderRenewals();
  if(v==='tasks') return renderTasks();

}

function render(){
  document.getElementById('app').innerHTML = `${renderNav()}<div id="main">${renderMain()}</div>`;
  bindEvents();
}

function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(node=>{
    node.addEventListener('click', (e)=>{
      const view = node.getAttribute('data-nav');
      const id = node.getAttribute('data-id');
      const filter = node.getAttribute('data-filter');
      const commsjump = node.getAttribute('data-commsjump');
      if(view==='students' && !id) state.studentFilter = filterMap(filter);
      if(commsjump) state.commsOpenId = commsjump;
      go(view, id);
    });
  });
  document.querySelectorAll('[data-studentfilter]').forEach(node=>{
    node.addEventListener('click', ()=>{ state.studentFilter = node.getAttribute('data-studentfilter'); render(); });
  });
  document.querySelectorAll('[data-renewalfilter]').forEach(node=>{
    node.addEventListener('click', ()=>{ state.renewalFilter = node.getAttribute('data-renewalfilter'); render(); });
  });
  document.querySelectorAll('[data-retentiontab]').forEach(node=>{
    node.addEventListener('click', ()=>{ state.retentionTab = node.getAttribute('data-retentiontab'); render(); });
  });
  document.querySelectorAll('[data-commsopen]').forEach(node=>{
    node.addEventListener('click', async ()=>{
      const id = node.getAttribute('data-commsopen');
      await openLiveConversation(id);
    });
  });
  const commsLogin = document.getElementById('comms-login-submit');
  if(commsLogin){
    commsLogin.addEventListener('click', async ()=>{
      const email = document.getElementById('comms-login-email').value.trim();
      const password = document.getElementById('comms-login-password').value;
      const error = document.getElementById('comms-login-error');
      commsLogin.disabled = true;
      try{
        await commsRequest('/api/auth/login', {method:'POST', body:JSON.stringify({email,password})});
        liveComms = {...liveComms, authenticated:true, loaded:false, loading:false, error:null};
        render();
      }catch(e){ error.textContent = e.message || 'Sign-in failed.'; }
      finally{ commsLogin.disabled = false; }
    });
  }
  const commsLogout = document.getElementById('comms-logout');
  if(commsLogout){
    commsLogout.addEventListener('click', async ()=>{
      await commsRequest('/api/auth/logout', {method:'POST'});
      liveComms = {loaded:true,loading:false,authenticated:false,email:null,error:null,conversations:[],open:null,openMessages:[]};
      render();
    });
  }
  const commsSend = document.getElementById('comms-reply-send');
  if(commsSend){
    commsSend.addEventListener('click', async ()=>{
      const input = document.getElementById('comms-reply-input');
      const text = input?.value.trim();
      const id = state.commsOpenId;
      if(!text || !id) return;
      commsSend.disabled = true;
      commsSend.textContent = 'Sending…';
      try{
        const msg = await commsRequest(`/api/conversations/${encodeURIComponent(id)}/messages`, {method:'POST', body:JSON.stringify({body:text, sender_name:'Christine (You)'})});
        liveComms.openMessages.push(msg);
        const row = liveComms.conversations.find(c=>c.id===id);
        if(row){ row.updated_at = msg.created_at; row.unread_for_admin=false; row.last_message={sender_type:'admin',body:text}; }
        input.value='';
        render();
      }catch(e){ toast(e.message || 'Message failed to send.'); commsSend.disabled=false; commsSend.textContent='Send'; }
    });
    const input = document.getElementById('comms-reply-input');
    if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); commsSend.click(); } });
  }
  const search = document.getElementById('student-search');
  if(search){
    search.addEventListener('input', (e)=>{ state.studentSearch = e.target.value; render(); document.getElementById('student-search').focus(); document.getElementById('student-search').selectionStart = document.getElementById('student-search').value.length; });
  }
  document.querySelectorAll('[data-tab]').forEach(node=>{
    node.addEventListener('click', ()=>{ state.profileTab = node.getAttribute('data-tab'); render(); });
  });
  document.querySelectorAll('[data-tabjump]').forEach(node=>{
    node.addEventListener('click', ()=>{ state.profileTab = node.getAttribute('data-tabjump'); render(); });
  });
  document.querySelectorAll('[data-toggle]').forEach(node=>{
    node.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = node.getAttribute('data-toggle');
      state.collapsed[key] = !state.collapsed[key];
      render();
    });
  });
  document.querySelectorAll('[data-navtoggle]').forEach(node=>{
    node.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = node.getAttribute('data-navtoggle');
      state.navExpanded[key] = !navExpanded(key);
      render();
    });
  });
  document.querySelectorAll('[data-toast]').forEach(node=>{
    node.addEventListener('click', ()=> toast(node.getAttribute('data-toast')) );
  });
  document.querySelectorAll('[data-task]').forEach(node=>{
    node.addEventListener('click', ()=>{
      const id = node.getAttribute('data-task');
      const task = tasks.find(t=>t.id===id);
      task.done = !task.done;
      logActivity(`Task "${task.title}" marked ${task.done?'complete':'open'}`);
      render();
    });
  });
  const saveNote = document.getElementById('save-note');
  if(saveNote){
    saveNote.addEventListener('click', ()=>{
      const ta = document.getElementById('new-note');
      if(ta.value.trim()){
        const c = findCustomer(state.route.id);
        c.notes.unshift({ text: ta.value.trim(), author:'Christine', when:'Just now' });
        logActivity(`Note added to ${c.name.split(' (')[0]}'s profile`);
        render();
      }
    });
  }
}

function filterMap(f){
  if(f==='audit-pending') return 'audit-pending';
  if(f==='checkin-due') return 'checkin-due';
  if(f==='session-pending') return 'session-pending';
  if(f==='payment-issue') return 'payment-issue';
  if(f==='new') return 'new';
  return 'all';
}

render();
